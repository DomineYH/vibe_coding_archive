          prompt,
          description,
          stack_db,
          stack_backend,
          stack_frontend,
          stack_hosting,
          created_at,
          updated_at,
        ]
      properties:
        id: { type: string, format: uuid }
        owner: { $ref: "#/components/schemas/Owner" }
        name: { type: string }
        subject: { $ref: "#/components/schemas/Subject" }
        grades: { type: array, items: { $ref: "#/components/schemas/Grade" } }
