openapi: 3.1.0
info:
  title: EduVibe Archive API
  version: 1.0.0
  description: Phase 1 public catalog reads and mock registration contract.
servers:
  - url: /api/v1
paths:
  /auth/flows:
    post:
      operationId: createAuthFlow
      summary: Allocate a new mockable authentication flow identity
      security: []
      parameters:
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAuthFlowInput" }
      responses:
        "201":
          description: New flow identity; no credential is issued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthFlowCreated" }
        "409": { $ref: "#/components/responses/ServiceError" }
        "429": { $ref: "#/components/responses/ServiceError" }
        "503": { $ref: "#/components/responses/ServiceError" }
  /auth/flows/{flow_id}/recovery-cookie:
    post:
      operationId: issueRecoveryCookie
      summary: Issue the first recovery credential for an unprepared flow
      security: []
      parameters:
        - $ref: "#/components/parameters/FlowPathId"
        - $ref: "#/components/parameters/Origin"
      responses:
        "201":
          description: A new non-persistent recovery cookie was issued.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryCookieResult" }
        "409": { $ref: "#/components/responses/ServiceError" }
        "429": { $ref: "#/components/responses/ServiceError" }
        "503": { $ref: "#/components/responses/ServiceError" }
  /auth/flows/{flow_id}/ready:
    post:
      operationId: confirmRecoveryCookie
      summary: Confirm that the current recovery cookie was received
      security:
        - RecoveryCookie: []
      parameters:
        - $ref: "#/components/parameters/FlowPathId"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExpectedRevisionInput" }
      responses:
        "200":
          description: Recovery credential receipt confirmed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryReady" }
        "401": { $ref: "#/components/responses/ServiceError" }
        "409": { $ref: "#/components/responses/ServiceError" }
        "503": { $ref: "#/components/responses/ServiceError" }
  /auth/flows/{flow_id}/abandon:
    post:
      operationId: abandonAuthFlow
      summary: Abandon only a flow that was never marked ready
      security: []
      parameters:
        - $ref: "#/components/parameters/FlowPathId"
        - $ref: "#/components/parameters/Origin"
      responses:
        "200":
          description: The unprepared flow may be replaced.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RestartEligibility" }
        "409": { $ref: "#/components/responses/ServiceError" }
        "503": { $ref: "#/components/responses/ServiceError" }
  /auth/recovery-context:
    get:
      operationId: getAuthRecoveryContext
      summary: Find only flows proved by a current recovery or session credential
      security:
        - RecoveryCookie: []
        - SessionCookie: []
      responses:
        "200":
          description: Proved flow IDs only; no member or transition result data.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryContext" }
        "401": { $ref: "#/components/responses/ServiceError" }
        "503": { $ref: "#/components/responses/ServiceError" }
  /auth/flows/{flow_id}/recovery-csrf:
    get:
      operationId: getRecoveryCsrf
      summary: Read the existing recovery CSRF token without rotating it
      security:
        - RecoveryCookie: []
      parameters:
        - $ref: "#/components/parameters/FlowPathId"
      responses:
        "200":
          description: Existing recovery CSRF token; no lifetime extension.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryCsrf" }
        "401": { $ref: "#/components/responses/ServiceError" }
        "503": { $ref: "#/components/responses/ServiceError" }
  /auth/flows/{flow_id}/recovery-cookie/rotate:
    post:
      operationId: rotateRecoveryCookie
      summary: Rotate recovery proof using the current full session
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/FlowPathId"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RotateRecoveryCookieInput" }
      responses:
        "201":
          description: A new recovery credential; current session and expiry are preserved.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryCookieResult" }
        "401": { $ref: "#/components/responses/ServiceError" }
        "409": { $ref: "#/components/responses/ServiceError" }
        "503": { $ref: "#/components/responses/ServiceError" }
  /auth/flows/{flow_id}/restart-eligibility:
    get:
      operationId: getRestartEligibility
      summary: Check whether an unproved flow can safely be replaced
      security: []
      parameters:
        - $ref: "#/components/parameters/FlowPathId"
      responses:
        "200":
          description: Eligibility only; no flow mutation or result lookup.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RestartEligibility" }
        "404": { $ref: "#/components/responses/ServiceError" }
        "503": { $ref: "#/components/responses/ServiceError" }
  /auth/transitions:
    post:
      operationId: admitAuthTransition
      summary: Admit one authentication transition at an expected flow revision
      security:
        - SessionCookie: []
        - RecoveryCookie: []
      parameters:
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/AuthTransitionAdmissionInput" }
      responses:
        "201":
          description: One-use transition permit; credentials and request body are not stored.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthTransitionPermit" }
        "401": { $ref: "#/components/responses/ServiceError" }
        "409": { $ref: "#/components/responses/ServiceError" }
        "429": { $ref: "#/components/responses/ServiceError" }
        "503": { $ref: "#/components/responses/ServiceError" }
  /auth/transitions/{transition_id}/settle:
    post:
      operationId: settleAuthTransition
      summary: Block late execution and settle or report an unavailable result
      security:
        - RecoveryCookie: []
      parameters:
        - $ref: "#/components/parameters/TransitionPathId"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SettleAuthTransitionInput" }
      responses:
        "200":
          description: Safe terminal summary; prior success is never rolled back.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettledAuthTransition" }
        "401": { $ref: "#/components/responses/ServiceError" }
        "409": { $ref: "#/components/responses/ServiceError" }
        "503": { $ref: "#/components/responses/ServiceError" }
  /auth/transitions/{transition_id}/discard-session:
    post:
      operationId: discardAuthTransitionSession
      summary: Discard only the session issued by a successful transition but not received
      security:
        - RecoveryCookie: []
      parameters:
        - $ref: "#/components/parameters/TransitionPathId"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DiscardAuthSessionInput" }
      responses:
        "200":
          description: The exact missing session was discarded; other generations are unchanged.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlowRevision" }
        "401": { $ref: "#/components/responses/ServiceError" }
        "409": { $ref: "#/components/responses/ServiceError" }
        "503": { $ref: "#/components/responses/ServiceError" }
  /auth/flows/{flow_id}/reset:
    post:
      operationId: resetAuthFlow
      summary: Explicitly reset only the flow proved by the supplied cookie
      security:
        - RecoveryCookie: []
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/FlowPathId"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResetAuthFlowInput" }
      responses:
        "200":
          description: The proved flow was ended and can be restarted.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RestartEligibility" }
        "401": { $ref: "#/components/responses/ServiceError" }
        "409": { $ref: "#/components/responses/ServiceError" }
        "503": { $ref: "#/components/responses/ServiceError" }
  /auth/anonymous-session:
    post:
      operationId: issueAnonymousSession
      summary: Issue the first anonymous session after recovery preparation
      security:
        - RecoveryCookie: []
      parameters:
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/AuthFlowId"
        - $ref: "#/components/parameters/AuthRevision"
        - $ref: "#/components/parameters/TransitionId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExpectedRevisionInput" }
      responses:
        "201":
          description: Anonymous session and its current CSRF token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnonymousSessionResult" }
        "401": { $ref: "#/components/responses/ServiceError" }
        "409": { $ref: "#/components/responses/ServiceError" }
        "503": { $ref: "#/components/responses/ServiceError" }
  /auth/csrf:
    get:
      operationId: getAuthCsrf
      summary: Read the current session CSRF token without starting a new session
      description: >-
        Reads only an existing valid session. Initial anonymous-session
        preparation uses POST /auth/anonymous-session.
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/AuthFlowId"
      responses:
        "200":
          description: Current CSRF token and expiry.
          headers:
            X-EduVibe-Flow-Id: { schema: { type: string, format: uuid } }
            X-EduVibe-Auth-Revision:
              { schema: { type: string, pattern: "^(0|[1-9][0-9]*)$" } }
            X-EduVibe-Session-Generation:
              { schema: { type: string, pattern: "^(0|[1-9][0-9]*)$" } }
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfToken"
        "401":
          $ref: "#/components/responses/ServiceError"
        "503":
          $ref: "#/components/responses/ServiceError"
  /auth/me:
    get:
      operationId: getAuthMe
      summary: Restore the current authenticated member
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/AuthFlowId"
        - $ref: "#/components/parameters/AuthRevision"
        - $ref: "#/components/parameters/SessionGeneration"
      responses:
        "200":
          description: The current member; contact fields are excluded or null.
          headers:
            X-EduVibe-Flow-Id: { schema: { type: string, format: uuid } }
            X-EduVibe-Auth-Revision:
              { schema: { type: string, pattern: "^(0|[1-9][0-9]*)$" } }
            X-EduVibe-Session-Generation:
              { schema: { type: string, pattern: "^(0|[1-9][0-9]*)$" } }
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Self"
        "401":
          $ref: "#/components/responses/ServiceError"
        "503":
          $ref: "#/components/responses/ServiceError"
  /auth/flow-state:
    get:
      operationId: getAuthFlowState
      summary: Read current authentication flow metadata
      description: >-
        Reads the current flow, selected session, pending transition, and an
        optional requested transition result. Unavailable results are distinct
        from terminal transition states.
      security:
        - RecoveryCookie: []
      parameters:
        - name: X-EduVibe-Flow-Id
          in: header
          required: true
          schema: { type: string, format: uuid }
        - name: transition_id
          in: query
          required: false
          schema: { type: string, pattern: "^[0-9a-f-]{36}\\.(0|[1-9][0-9]*)$" }
      responses:
        "200":
          description: Current authentication flow identity and sequence.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthFlowState"
        "401":
          $ref: "#/components/responses/ServiceError"
        "503":
          $ref: "#/components/responses/ServiceError"
  /auth/login:
    post:
      operationId: login
      summary: Sign in an approved member
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/AuthFlowId"
        - $ref: "#/components/parameters/AuthRevision"
        - $ref: "#/components/parameters/SessionGeneration"
        - $ref: "#/components/parameters/TransitionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated member and rotated CSRF token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "401":
          $ref: "#/components/responses/ServiceError"
        "403":
          $ref: "#/components/responses/ServiceError"
        "409":
          $ref: "#/components/responses/ServiceError"
        "429":
          $ref: "#/components/responses/ServiceError"
        "503":
          $ref: "#/components/responses/ServiceError"
  /auth/register:
    post:
      operationId: register
      summary: Submit a member registration for manual approval
      description: >-
        Creates an unapproved user and never signs the user in. The
        password_confirm field is not accepted. While contact collection is
        disabled, omitted, null, or normalized-empty email/phone values are
        accepted and non-empty values receive field validation errors. No
        partial account is created on validation failure.
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/AuthFlowId"
        - $ref: "#/components/parameters/AuthRevision"
        - $ref: "#/components/parameters/SessionGeneration"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Unapproved account and calculated pending expiry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisteredUser"
        "400":
          $ref: "#/components/responses/ServiceError"
        "403":
          $ref: "#/components/responses/ServiceError"
        "409":
          $ref: "#/components/responses/ServiceError"
        "413":
          $ref: "#/components/responses/ServiceError"
        "422":
          $ref: "#/components/responses/ServiceError"
        "429":
          $ref: "#/components/responses/ServiceError"
        "503":
          $ref: "#/components/responses/ServiceError"
  /auth/password:
    post:
      operationId: changePassword
      summary: Replace the temporary password in a change-only session
      description: >-
        Requires a valid change-only session. The password is normalized to NFC
        without trimming; confirmation stays in the browser and is not sent.
        The request is rejected when the temporary credential or session has
        expired, including at the exact expiry boundary.
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/AuthFlowId"
        - $ref: "#/components/parameters/AuthRevision"
        - $ref: "#/components/parameters/SessionGeneration"
        - $ref: "#/components/parameters/TransitionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      responses:
        "200":
          description: The temporary credential is consumed and a full session is issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "401":
          $ref: "#/components/responses/ServiceError"
        "403":
          $ref: "#/components/responses/ServiceError"
        "422":
          $ref: "#/components/responses/ServiceError"
        "503":
          $ref: "#/components/responses/ServiceError"
  /auth/logout:
    post:
      operationId: logout
      summary: Sign out the current browser session
      security:
        - {}
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/AuthFlowId"
        - $ref: "#/components/parameters/AuthRevision"
        - $ref: "#/components/parameters/SessionGeneration"
        - $ref: "#/components/parameters/TransitionId"
      responses:
        "204":
          description: The current session was cleared or was already anonymous.
        "403":
          $ref: "#/components/responses/ServiceError"
        "503":
          $ref: "#/components/responses/ServiceError"
  /auth/reauth:
    post:
      operationId: reauthenticate
      summary: Reauthenticate the current administrator without extending the absolute session expiry
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/AuthFlowId"
        - $ref: "#/components/parameters/AuthRevision"
        - $ref: "#/components/parameters/SessionGeneration"
        - $ref: "#/components/parameters/TransitionId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReauthenticateInput" }
      responses:
        "200":
          description: Current administrator session and CSRF are rotated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResult" }
        "401": { $ref: "#/components/responses/ServiceError" }
        "403": { $ref: "#/components/responses/ServiceError" }
        "409": { $ref: "#/components/responses/ServiceError" }
        "503": { $ref: "#/components/responses/ServiceError" }
  /meta:
    get:
      operationId: getMeta
      summary: Read public catalog metadata
      security: []
      responses:
        "200":
          description: Public catalog metadata and feature availability.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meta"
        "400":
          $ref: "#/components/responses/ServiceError"
        "503":
          $ref: "#/components/responses/ServiceError"
  /apps:
    get:
      operationId: listPublicApps
      summary: List public archive apps
      description: >-
        Returns publicly accessible apps ordered by created_at descending, then
        id descending. Subject facets describe the full accessible set and do
        not depend on search, grade, or page offset. Reject repeated and unknown
        query parameters.
      security: []
      parameters:
        - name: q
          in: query
          description: >-
            Trim, normalize to NFC, then apply Unicode default case folding.
            Count the post-folded value in Unicode code points; reject values
            longer than 100 without truncation. Search name, author nickname,
            and description as separate substring fields. Treat percent and
            underscore literally; do not search login IDs or contact fields.
          schema: { type: string }
        - name: subject
          in: query
          description: Empty omits the filter; otherwise use one catalog value.
          schema:
            anyOf:
              - type: string
                enum: [""]
              - $ref: "#/components/schemas/Subject"
        - name: grade
          in: query
          description: Empty omits the filter; otherwise use one catalog value.
          schema:
            anyOf:
              - type: string
                enum: [""]
              - $ref: "#/components/schemas/Grade"
        - name: limit
          in: query
          description: Page size; defaults to 24 and cannot exceed 100.
          schema: { type: integer, minimum: 1, maximum: 100, default: 24 }
        - name: offset
          in: query
          description: Zero-based offset. A valid offset past the result count returns an empty page.
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: A page of public app cards.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppPage"
        "400":
          $ref: "#/components/responses/ServiceError"
        "503":
          $ref: "#/components/responses/ServiceError"
    post:
      operationId: createApp
      summary: Create an archive app with an issued operation key
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/AuthFlowId"
        - $ref: "#/components/parameters/AuthRevision"
        - $ref: "#/components/parameters/SessionGeneration"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppInput" }
      responses:
        "201":
          description: The persisted app and its current owner.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppDetailResponse" }
        "400": { $ref: "#/components/responses/ServiceError" }
        "401": { $ref: "#/components/responses/ServiceError" }
        "403": { $ref: "#/components/responses/ServiceError" }
        "404": { $ref: "#/components/responses/ServiceError" }
        "409": { $ref: "#/components/responses/ServiceError" }
        "410": { $ref: "#/components/responses/ServiceError" }
        "422": { $ref: "#/components/responses/ServiceError" }
        "429": { $ref: "#/components/responses/ServiceError" }
        "503": { $ref: "#/components/responses/ServiceError" }
  /apps/{id}:
    get:
      operationId: getApp
      summary: Read an archive app available to the current member
      security:
        - {}
        - SessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Public app detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppDetailResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/ServiceError"
        "403":
          $ref: "#/components/responses/ServiceError"
        "503":
          $ref: "#/components/responses/ServiceError"
  /admin/users:
    get:
      operationId: listAdminUsers
      summary: List users and aggregate dashboard statistics
      description: >-
        Pending users sort first, then creation time and member ID ascending.
        The page always carries aggregates for the full authorized member set.
      security:
        - SessionCookie: []
      parameters:
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 24 },
          }
        - {
            name: offset,
            in: query,
            schema: { type: integer, minimum: 0, default: 0 },
          }
        - $ref: "#/components/parameters/AuthFlowId"
        - $ref: "#/components/parameters/AuthRevision"
        - $ref: "#/components/parameters/SessionGeneration"
      responses:
        "200":
          description: An offset page and aggregate statistics for all users/apps.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserPage" }
        "401": { $ref: "#/components/responses/ServiceError" }
        "403": { $ref: "#/components/responses/ServiceError" }
        "409": { $ref: "#/components/responses/ServiceError" }
        "503": { $ref: "#/components/responses/ServiceError" }
  /admin/users/{id}:
    get:
      operationId: getAdminUser
      summary: Read an approval target with its current account version
      security:
        - SessionCookie: []
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
        - $ref: "#/components/parameters/AuthFlowId"
        - $ref: "#/components/parameters/AuthRevision"
        - $ref: "#/components/parameters/SessionGeneration"
      responses:
        "200":
          description: The current target without contact fields.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "401": { $ref: "#/components/responses/ServiceError" }
        "403": { $ref: "#/components/responses/ServiceError" }
        "404": { $ref: "#/components/responses/ServiceError" }
        "409": { $ref: "#/components/responses/ServiceError" }
        "503": { $ref: "#/components/responses/ServiceError" }
  /write-operations:
    post:
      operationId: createWriteOperation
      summary: Issue a write operation key without changing app or account data
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/AuthFlowId"
        - $ref: "#/components/parameters/AuthRevision"
        - $ref: "#/components/parameters/SessionGeneration"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateWriteOperation" }
      responses:
        "201":
          description: An unresolved key result with no echoed business input.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ApprovalOperation"
                  - $ref: "#/components/schemas/AppWriteOperation"
        "400": { $ref: "#/components/responses/ServiceError" }
        "401": { $ref: "#/components/responses/ServiceError" }
        "403": { $ref: "#/components/responses/ServiceError" }
        "404": { $ref: "#/components/responses/ServiceError" }
        "409": { $ref: "#/components/responses/ServiceError" }
        "422": { $ref: "#/components/responses/ServiceError" }
        "503": { $ref: "#/components/responses/ServiceError" }
  /admin/users/{id}/approval:
    patch:
      operationId: setAdminUserApproval
      summary: Explicitly set the approval value for one current target version
      security:
        - SessionCookie: []
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
        - {
            name: Idempotency-Key,
            in: header,
            required: true,
            schema: { type: string, format: uuid },
          }
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/AuthFlowId"
        - $ref: "#/components/parameters/AuthRevision"
        - $ref: "#/components/parameters/SessionGeneration"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetApprovalInput" }
      responses:
        "200":
          description: The account state applied by this request.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "400": { $ref: "#/components/responses/ServiceError" }
        "401": { $ref: "#/components/responses/ServiceError" }
        "403": { $ref: "#/components/responses/ServiceError" }
        "404": { $ref: "#/components/responses/ServiceError" }
        "409": { $ref: "#/components/responses/ServiceError" }
        "410": { $ref: "#/components/responses/ServiceError" }
        "503": { $ref: "#/components/responses/ServiceError" }
  /write-operations/{key}:
    get:
      operationId: getWriteOperation
      summary: Read the minimal result for a write operation key
      security:
        - SessionCookie: []
      parameters:
        - {
            name: key,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
        - $ref: "#/components/parameters/AuthFlowId"
        - $ref: "#/components/parameters/AuthRevision"
        - $ref: "#/components/parameters/SessionGeneration"
      responses:
        "200":
          description: Unresolved is not success; the result does not expose input.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ApprovalOperation"
                  - $ref: "#/components/schemas/AppWriteOperation"
        "401": { $ref: "#/components/responses/ServiceError" }
        "403": { $ref: "#/components/responses/ServiceError" }
        "404": { $ref: "#/components/responses/ServiceError" }
        "409": { $ref: "#/components/responses/ServiceError" }
        "410": { $ref: "#/components/responses/ServiceError" }
        "503": { $ref: "#/components/responses/ServiceError" }
  /write-operations/{key}/cancel:
    post:
      operationId: cancelApprovalOperation
      summary: Cancel an unresolved approval key without changing its target input
      security:
        - SessionCookie: []
      parameters:
        - {
            name: key,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/AuthFlowId"
        - $ref: "#/components/parameters/AuthRevision"
        - $ref: "#/components/parameters/SessionGeneration"
      responses:
        "200":
          description: The result after cancellation; a prior success is not rolled back.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApprovalOperation" }
        "401": { $ref: "#/components/responses/ServiceError" }
        "403": { $ref: "#/components/responses/ServiceError" }
        "404": { $ref: "#/components/responses/ServiceError" }
        "409": { $ref: "#/components/responses/ServiceError" }
        "410": { $ref: "#/components/responses/ServiceError" }
        "503": { $ref: "#/components/responses/ServiceError" }
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }
    FlowPathId:
      name: flow_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    TransitionPathId:
      name: transition_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9a-f-]{36}\\.(0|[1-9][0-9]*)$"
    Origin:
      name: Origin
      in: header
      required: true
      schema: { type: string, format: uri }
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string, minLength: 1 }
    AuthFlowId:
      name: X-EduVibe-Flow-Id
      in: header
      required: true
      schema: { type: string, format: uuid }
    AuthRevision:
      name: X-EduVibe-Auth-Revision
      in: header
      required: true
      schema: { type: string, pattern: "^(0|[1-9][0-9]*)$" }
    SessionGeneration:
      name: X-EduVibe-Session-Generation
      in: header
      required: true
      schema: { type: string, pattern: "^(0|[1-9][0-9]*)$" }
    TransitionId:
      name: X-EduVibe-Transition-Id
      in: header
      required: true
      schema:
        type: string
        pattern: "^[0-9a-f-]{36}\\.(0|[1-9][0-9]*)$"
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: __Host-eduvibe_session_<flow_id>_<issued_seq>
      description: >-
        Production cookies use a fresh name per flow and issued sequence.
        Explicit HTTP localhost/loopback development names are
        eduvibe_session_dev_<flow_id>_<issued_seq>.
    RecoveryCookie:
      type: apiKey
      in: cookie
      name: __Host-eduvibe_recovery_<flow_id>_<issued_seq>
      description: >-
        The name is generated per flow. The placeholders stand for the request's
        X-EduVibe-Flow-Id and the server-issued recovery sequence.
  responses:
    NotFound:
      description: The app does not exist or is not accessible to the current member.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ServiceError:
      description: The request failed or the response could not be accepted.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    Role:
      type: string
      enum: [user, admin]
    SessionKind:
      type: string
      enum: [full, change_only]
    LoginInput:
      type: object
      additionalProperties: false
      required: [login_id, password]
      properties:
        login_id:
          type: string
          minLength: 2
          maxLength: 32
          pattern: "^[가-힣A-Za-z0-9_.-]+$"
        password: { type: string, minLength: 1 }
    ChangePasswordInput:
      type: object
      additionalProperties: false
      required: [password]
      description: >-
        A new password of 15-128 Unicode code points. Normalize to NFC without
        trimming or truncation; compare the full normalized value against the
        versioned local common-password blocklist. Do not send it to an external
        service. The Phase 1 mock does not apply this check while list
        redistribution rights remain unresolved. The browser confirmation is
        never sent.
      properties:
        password:
          type: string
          minLength: 15
          maxLength: 128
    RegisterInput:
      type: object
      additionalProperties: false
      required: [login_id, password, nickname]
      description: >-
        login_id and nickname are trimmed and normalized to NFC; password is
        normalized to NFC without trimming. Lengths count Unicode code points.
        Password length is 15-128. The production contract checks the full
        normalized value against the versioned local common-password blocklist;
        the Phase 1 mock does not apply the check while list redistribution
        rights remain unresolved. email and phone are optional synthetic Phase
        1 inputs; password_confirm is never part of this request.
      properties:
        login_id:
          type: string
          minLength: 2
          maxLength: 32
          pattern: "^[가-힣A-Za-z0-9_.-]+$"
        password:
          type: string
          minLength: 15
          maxLength: 128
        nickname:
          type: string
          minLength: 2
          maxLength: 20
          description: Trimmed NFC text; no newline, control, or bidi controls.
        email:
          type: [string, "null"]
          maxLength: 254
          description: >-
            One address; local part case is preserved and the domain is
            normalized. No DNS or SMTP verification is performed.
        phone:
          type: [string, "null"]
          maxLength: 32
          description: >-
            ASCII digits with an optional leading plus, spaces, and hyphens;
            the digit count must be 7-15.
    AdminUser:
      type: object
      additionalProperties: false
      required:
        [
          id,
          login_id,
          nickname,
          role,
          approved,
          account_version,
          created_at,
          first_approved_at,
          pending_expires_at,
        ]
      properties:
        id: { type: string, format: uuid }
        login_id: { type: string, minLength: 2, maxLength: 32 }
        nickname: { type: string, minLength: 2, maxLength: 20 }
        role: { $ref: "#/components/schemas/Role" }
        approved: { type: boolean }
        account_version:
          type: integer
          minimum: 1
          maximum: 9007199254740991
          description: >-
            Monotonic approval/credential version. Expected by approval writes;
            never exposed by public member DTOs.
        created_at: { type: string, format: date-time }
        first_approved_at: { type: [string, "null"], format: date-time }
        pending_expires_at: { type: [string, "null"], format: date-time }
    AdminStats:
      type: object
      additionalProperties: false
      required: [total_users, pending_users, total_apps, healthy_apps]
      properties:
        total_users: { type: integer, minimum: 0 }
        pending_users: { type: integer, minimum: 0 }
        total_apps: { type: integer, minimum: 0 }
        healthy_apps: { type: integer, minimum: 0 }
    AdminUserPage:
      type: object
      additionalProperties: false
      required: [items, pagination, stats, server_time]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminUser" }
        pagination: { $ref: "#/components/schemas/Pagination" }
        stats: { $ref: "#/components/schemas/AdminStats" }
        server_time: { type: string, format: date-time }
    CreateApprovalOperation:
      type: object
      additionalProperties: false
      required: [kind, target_id, expected_account_version, approved]
      properties:
        kind: { type: string, const: user_approval }
        target_id: { type: string, format: uuid }
        expected_account_version:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        approved: { type: boolean }
    CreateAppWriteOperation:
      type: object
      additionalProperties: false
      required: [kind, input]
      properties:
        kind: { type: string, const: app_create }
        input: { $ref: "#/components/schemas/AppInput" }
    CreateWriteOperation:
      oneOf:
        - $ref: "#/components/schemas/CreateApprovalOperation"
        - $ref: "#/components/schemas/CreateAppWriteOperation"
    SetApprovalInput:
      type: object
      additionalProperties: false
      required: [approved, expected_account_version]
      properties:
        approved: { type: boolean }
        expected_account_version:
          type: integer
          minimum: 1
          maximum: 9007199254740991
    ApprovalOperation:
      type: object
      additionalProperties: false
      required:
        [
          key,
          kind,
          target_id,
          issued_at,
          expires_at,
          state,
          applied_account_version,
          applied_approved,
          finalized_at,
          rejection_code,
        ]
      properties:
        key: { type: string, format: uuid }
        kind: { type: string, const: user_approval }
        target_id: { type: string, format: uuid }
        issued_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        state: { type: string, enum: [unresolved, succeeded, rejected] }
        applied_account_version:
          type: [integer, "null"]
          minimum: 1
          maximum: 9007199254740991
        applied_approved: { type: [boolean, "null"] }
        finalized_at: { type: [string, "null"], format: date-time }
        rejection_code: { type: [string, "null"] }
    AppWriteOperation:
      type: object
      additionalProperties: false
      required:
        [
          key,
          kind,
          target_id,
          issued_at,
          expires_at,
          state,
          db_applied_at,
          finalized_at,
          result_version,
          rejection_code,
          server_time,
        ]
      properties:
        key: { type: string, format: uuid }
        kind: { type: string, const: app_create }
        target_id: { type: [string, "null"], format: uuid }
        issued_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        state: { type: string, enum: [unresolved, succeeded, rejected] }
        db_applied_at: { type: [string, "null"], format: date-time }
        finalized_at: { type: [string, "null"], format: date-time }
        result_version:
          { type: [integer, "null"], minimum: 1, maximum: 9007199254740991 }
        rejection_code: { type: [string, "null"] }
        server_time: { type: string, format: date-time }
    RegisteredUser:
      type: object
      additionalProperties: false
      required: [id, login_id, nickname, approved, pending_expires_at]
      properties:
        id: { type: string, format: uuid }
        login_id: { type: string }
        nickname: { type: string }
        approved: { type: boolean, const: false }
        pending_expires_at: { type: string, format: date-time }
    Self:
      type: object
      additionalProperties: false
      required:
        [
          id,
          login_id,
          nickname,
          role,
          approved,
          must_change_password,
          session_kind,
          expires_at,
        ]
      properties:
        id: { type: string, format: uuid }
        login_id: { type: string }
        nickname: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        approved: { type: boolean }
        must_change_password: { type: boolean }
        session_kind: { $ref: "#/components/schemas/SessionKind" }
        expires_at: { type: string, format: date-time }
        email: { type: [string, "null"] }
        phone: { type: [string, "null"] }
        recent_auth_until: { type: [string, "null"], format: date-time }
      allOf:
        - if:
            properties:
              session_kind: { const: full }
          then:
            required: [email, phone, recent_auth_until]
            properties:
              approved: { const: true }
              must_change_password: { const: false }
              email: { type: [string, "null"] }
              phone: { type: [string, "null"] }
              recent_auth_until: { type: [string, "null"], format: date-time }
        - if:
            properties:
              session_kind: { const: change_only }
          then:
            properties:
              must_change_password: { const: true }
    AuthTransition:
      type: object
      additionalProperties: false
      required:
        - transition_id
        - availability
        - execution_blocked
        - kind
        - state
        - permit_expires_at
        - result_session_generation
        - failure_code
      properties:
        transition_id:
          type: string
          pattern: "^[0-9a-f-]{36}\\.(0|[1-9][0-9]*)$"
        availability: { type: string, enum: [available, unavailable] }
        execution_blocked: { type: [boolean, "null"] }
        kind:
          type: [string, "null"]
          enum:
            [
              anonymous_session,
              login,
              logout,
              password_change,
              reauthenticate,
              null,
            ]
        state:
          type: [string, "null"]
          enum:
            [admitted, executing, succeeded, failed, cancelled, expired, null]
        permit_expires_at: { type: [string, "null"], format: date-time }
        result_session_generation:
          type: [string, "null"]
          pattern: "^(0|[1-9][0-9]*)$"
        failure_code: { type: [string, "null"] }
    AuthFlowState:
      type: object
      additionalProperties: false
      required:
        - flow_id
        - revision
        - server_time
        - expires_at
        - recovery_ready
        - session_generation
        - session_cookie_present
        - last_identity_change_revision
        - pending_transition
        - requested_transition
        - next_transition_id
      properties:
        flow_id: { type: string, format: uuid }
        revision:
          type: string
          pattern: "^(0|[1-9][0-9]*)$"
        server_time: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        recovery_ready: { type: boolean }
        session_generation:
          type: [string, "null"]
          pattern: "^(0|[1-9][0-9]*)$"
        session_cookie_present: { type: boolean }
        last_identity_change_revision:
          type: string
          pattern: "^(0|[1-9][0-9]*)$"
        pending_transition:
          anyOf:
            - $ref: "#/components/schemas/AuthTransition"
            - type: "null"
        requested_transition:
          anyOf:
            - $ref: "#/components/schemas/AuthTransition"
            - type: "null"
        next_transition_id:
          type: [string, "null"]
          pattern: "^[0-9a-f-]{36}\\.(0|[1-9][0-9]*)$"
    CreateAuthFlowInput:
      type: object
      additionalProperties: false
      required: [restart_from]
      properties:
        restart_from:
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }
    AuthFlowCreated:
      type: object
      additionalProperties: false
      required: [flow_id, revision, expires_at]
      properties:
        flow_id: { type: string, format: uuid }
        revision:
          type: string
          pattern: "^(0|[1-9][0-9]*)$"
        expires_at: { type: string, format: date-time }
    FlowRevision:
      type: object
      additionalProperties: false
      required: [flow_id, revision]
      properties:
        flow_id: { type: string, format: uuid }
        revision:
          type: string
          pattern: "^(0|[1-9][0-9]*)$"
    RecoveryCookieResult:
      type: object
      additionalProperties: false
      required: [flow_id, revision, recovery_csrf_token, expires_at]
      properties:
        flow_id: { type: string, format: uuid }
        revision:
          type: string
          pattern: "^(0|[1-9][0-9]*)$"
        recovery_csrf_token: { type: string, minLength: 1 }
        expires_at: { type: string, format: date-time }
    RecoveryReady:
      type: object
      additionalProperties: false
      required: [flow_id, revision, expires_at, ready]
      properties:
        flow_id: { type: string, format: uuid }
        revision:
          type: string
          pattern: "^(0|[1-9][0-9]*)$"
        expires_at: { type: string, format: date-time }
        ready: { const: true }
    RestartEligibility:
      type: object
      additionalProperties: false
      required: [restart_eligible]
      properties:
        restart_eligible: { type: boolean }
    RecoveryContext:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/RecoveryContextItem" }
    RecoveryContextItem:
      type: object
      additionalProperties: false
      required: [flow_id, revision, proof_kind]
      properties:
        flow_id: { type: string, format: uuid }
        revision:
          type: string
          pattern: "^(0|[1-9][0-9]*)$"
        proof_kind: { type: string, enum: [recovery, session] }
    RecoveryCsrf:
      type: object
      additionalProperties: false
      required: [flow_id, revision, recovery_csrf_token, expires_at]
      properties:
        flow_id: { type: string, format: uuid }
        revision:
          type: string
          pattern: "^(0|[1-9][0-9]*)$"
        recovery_csrf_token: { type: string, minLength: 1 }
        expires_at: { type: string, format: date-time }
    ExpectedRevisionInput:
      type: object
      additionalProperties: false
      required: [expected_revision]
      properties:
        expected_revision:
          type: string
          pattern: "^(0|[1-9][0-9]*)$"
    RotateRecoveryCookieInput:
      type: object
      additionalProperties: false
      required: [expected_revision, expected_session_generation]
      properties:
        expected_revision:
          type: string
          pattern: "^(0|[1-9][0-9]*)$"
        expected_session_generation:
          type: string
          pattern: "^(0|[1-9][0-9]*)$"
    AuthTransitionAdmissionInput:
      type: object
      additionalProperties: false
      required:
        - flow_id
        - transition_id
        - kind
        - expected_revision
        - expected_session_generation
      properties:
        flow_id: { type: string, format: uuid }
        transition_id:
          type: string
          pattern: "^[0-9a-f-]{36}\\.(0|[1-9][0-9]*)$"
        kind:
          type: string
          enum:
            [anonymous_session, login, logout, password_change, reauthenticate]
        expected_revision:
          type: string
          pattern: "^(0|[1-9][0-9]*)$"
        expected_session_generation:
          type: [string, "null"]
          pattern: "^(0|[1-9][0-9]*)$"
    AuthTransitionPermit:
      type: object
      additionalProperties: false
      required: [flow_id, transition_id, kind, revision, permit_expires_at]
      properties:
        flow_id: { type: string, format: uuid }
        transition_id:
          type: string
          pattern: "^[0-9a-f-]{36}\\.(0|[1-9][0-9]*)$"
        kind:
          type: string
          enum:
            [anonymous_session, login, logout, password_change, reauthenticate]
        revision:
          type: string
          pattern: "^(0|[1-9][0-9]*)$"
        permit_expires_at: { type: string, format: date-time }
    SettleAuthTransitionInput:
      type: object
      additionalProperties: false
      required: [flow_id, expected_revision]
      properties:
        flow_id: { type: string, format: uuid }
        expected_revision:
          type: string
          pattern: "^(0|[1-9][0-9]*)$"
    SettledAuthTransition:
      type: object
      additionalProperties: false
      required: [flow_id, revision, transition_id, result]
      properties:
        flow_id: { type: string, format: uuid }
        revision:
          type: string
          pattern: "^(0|[1-9][0-9]*)$"
        transition_id:
          type: string
          pattern: "^[0-9a-f-]{36}\\.(0|[1-9][0-9]*)$"
        result: { $ref: "#/components/schemas/AuthTransition" }
    DiscardAuthSessionInput:
      type: object
      additionalProperties: false
      required: [flow_id, expected_revision, expected_session_generation]
      properties:
        flow_id: { type: string, format: uuid }
        expected_revision:
          type: string
          pattern: "^(0|[1-9][0-9]*)$"
        expected_session_generation:
          type: string
          pattern: "^(0|[1-9][0-9]*)$"
    ResetAuthFlowInput:
      type: object
      additionalProperties: false
      required: [expected_revision]
      properties:
        expected_revision:
          type: string
          pattern: "^(0|[1-9][0-9]*)$"
        expected_session_generation:
          type: [string, "null"]
          pattern: "^(0|[1-9][0-9]*)$"
    AnonymousSessionResult:
      type: object
      additionalProperties: false
      required: [flow_id, revision, session_generation, csrf_token, expires_at]
      properties:
        flow_id: { type: string, format: uuid }
        revision:
          type: string
          pattern: "^(0|[1-9][0-9]*)$"
        session_generation:
          type: string
          pattern: "^(0|[1-9][0-9]*)$"
        csrf_token: { type: string, minLength: 1 }
        expires_at: { type: string, format: date-time }
    ReauthenticateInput:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password: { type: string, minLength: 15, maxLength: 128 }
    AuthResult:
      type: object
      additionalProperties: false
      required: [user, csrf_token]
      properties:
        user: { $ref: "#/components/schemas/Self" }
        csrf_token: { type: string, minLength: 1 }
    CsrfToken:
      type: object
      additionalProperties: false
      required: [csrf_token, expires_at]
      properties:
        csrf_token: { type: string, minLength: 1 }
        expires_at: { type: string, format: date-time }
    Subject:
      type: string
      enum: [수학, 과학, 영어, 역사, 국어, 사회, 정보, 기타]
    Grade:
      type: string
      enum: [초1, 초2, 초3, 초4, 초5, 초6, 중1, 중2, 중3, 고1, 고2, 고3]
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id]
          properties:
            code: { type: string }
            message: { type: string }
            fields: { type: object, additionalProperties: { type: string } }
            request_id: { type: [string, "null"] }
            reasons: { type: array, items: { type: string } }
            retry_at: { type: [string, "null"], format: date-time }
            server_time: { type: [string, "null"], format: date-time }
    Meta:
      type: object
      additionalProperties: false
      required:
        [
          subjects,
          grades,
          themes,
          server_time,
          capabilities,
          support,
          initial_pending_days,
        ]
      properties:
        subjects:
          { type: array, items: { $ref: "#/components/schemas/Subject" } }
        grades: { type: array, items: { $ref: "#/components/schemas/Grade" } }
        themes:
          type: array
          items: { $ref: "#/components/schemas/Theme" }
        server_time: { type: string, format: date-time }
        capabilities: { $ref: "#/components/schemas/Capabilities" }
        support: { $ref: "#/components/schemas/Support" }
        initial_pending_days: { type: integer, minimum: 1 }
    Theme:
      type: object
      additionalProperties: false
      required: [id, name, pantone, from, to, ink]
      properties:
        id: { type: string }
        name: { type: string }
        pantone: { type: string }
        from: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
        to: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
        ink: { type: string, enum: [dark, light] }
    Reason:
      type: string
      enum:
        [
          not_implemented,
          verification_pending,
          operational_restriction,
          collection_disabled,
        ]
    Capability:
      type: object
      additionalProperties: false
      required: [enabled, reasons]
      properties:
        enabled: { type: boolean }
        reasons: { type: array, items: { $ref: "#/components/schemas/Reason" } }
    Capabilities:
      type: object
      additionalProperties: false
      required:
        - apps_read
        - auth_register
        - auth_login
        - auth_logout
        - auth_password_change
        - admin_users_read
        - admin_approval
        - admin_summary
        - apps_create
        - apps_update_own
        - apps_delete_own
        - admin_apps_read
        - admin_apps_manage
        - admin_reauth
        - admin_password_reset
        - admin_user_delete
        - health_read
        - health_check
        - health_batch
        - email_collection
        - phone_collection
      properties:
        apps_read: { $ref: "#/components/schemas/Capability" }
        auth_register: { $ref: "#/components/schemas/Capability" }
        auth_login: { $ref: "#/components/schemas/Capability" }
        auth_logout: { $ref: "#/components/schemas/Capability" }
        auth_password_change: { $ref: "#/components/schemas/Capability" }
        admin_users_read: { $ref: "#/components/schemas/Capability" }
        admin_approval: { $ref: "#/components/schemas/Capability" }
        admin_summary: { $ref: "#/components/schemas/Capability" }
        apps_create: { $ref: "#/components/schemas/Capability" }
        apps_update_own: { $ref: "#/components/schemas/Capability" }
        apps_delete_own: { $ref: "#/components/schemas/Capability" }
        admin_apps_read: { $ref: "#/components/schemas/Capability" }
        admin_apps_manage: { $ref: "#/components/schemas/Capability" }
        admin_reauth: { $ref: "#/components/schemas/Capability" }
        admin_password_reset: { $ref: "#/components/schemas/Capability" }
        admin_user_delete: { $ref: "#/components/schemas/Capability" }
        health_read: { $ref: "#/components/schemas/Capability" }
        health_check: { $ref: "#/components/schemas/Capability" }
        health_batch: { $ref: "#/components/schemas/Capability" }
        email_collection: { $ref: "#/components/schemas/Capability" }
        phone_collection: { $ref: "#/components/schemas/Capability" }
    Support:
      type: object
      additionalProperties: false
      required: [email, service_url, announcement_url]
      properties:
        email: { type: [string, "null"] }
        service_url: { type: [string, "null"], format: uri }
        announcement_url: { type: [string, "null"], format: uri }
    Owner:
      type: object
      additionalProperties: false
      required: [id, nickname]
      properties:
        id: { type: string, format: uuid }
        nickname: { type: string }
    Pagination:
      type: object
      additionalProperties: false
      required: [limit, offset, total, has_more]
      properties:
        limit: { type: integer, minimum: 1, maximum: 100 }
        offset: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0 }
        has_more: { type: boolean }
    HealthState:
      type: string
      enum:
        [
          unchecked,
          healthy,
          http_error,
          timeout,
          network_error,
          blocked,
          redirect_error,
        ]
    HealthResult:
      type: object
      additionalProperties: false
      required: [state, checked_at, fresh_until]
      properties:
        state: { $ref: "#/components/schemas/HealthState" }
        checked_at: { type: [string, "null"], format: date-time }
        fresh_until: { type: [string, "null"], format: date-time }
    HealthView:
      type: object
      additionalProperties: false
      required: [result, latest_job, next_check_at]
      properties:
        result: { $ref: "#/components/schemas/HealthResult" }
        latest_job:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Job"
        next_check_at: { type: [string, "null"], format: date-time }
    Job:
      type: object
      additionalProperties: false
      required: [id, status, created_at, started_at, finished_at, failure_code]
      properties:
        id: { type: string, format: uuid }
        status:
          {
            type: string,
            enum: [queued, running, completed, failed, cancelled],
          }
        created_at: { type: string, format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        failure_code: { type: [string, "null"] }
    AppCard:
      type: object
      additionalProperties: false
      required:
        [
          id,
          owner,
          name,
          subject,
          grades,
          is_public,
          theme_id,
          version,
          url_version,
          health,
        ]
      properties:
        id: { type: string, format: uuid }
        owner: { $ref: "#/components/schemas/Owner" }
        name: { type: string }
        subject: { $ref: "#/components/schemas/Subject" }
        grades: { type: array, items: { $ref: "#/components/schemas/Grade" } }
        is_public: { type: boolean }
        theme_id: { type: string }
        version: { type: integer, minimum: 1 }
        url_version: { type: integer, minimum: 1 }
        health: { $ref: "#/components/schemas/HealthView" }
    AppPage:
      type: object
      additionalProperties: false
      required: [items, pagination, server_time, facets]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AppCard" } }
        pagination: { $ref: "#/components/schemas/Pagination" }
        server_time: { type: string, format: date-time }
        facets:
          type: object
          additionalProperties: false
          required: [subjects_in_use]
          properties:
            subjects_in_use:
              { type: array, items: { $ref: "#/components/schemas/Subject" } }
    AppDetail:
      type: object
      additionalProperties: false
      required:
        [
          id,
          owner,
          name,
          subject,
          grades,
          is_public,
          theme_id,
          version,
          url_version,
          health,
          url,
          prompt,
          description,
          stack_db,
          stack_backend,
          stack_frontend,
          stack_hosting,
          created_at,
          updated_at,
        ]
      properties:
        id: { type: string, format: uuid }
        owner: { $ref: "#/components/schemas/Owner" }
        name: { type: string }
        subject: { $ref: "#/components/schemas/Subject" }
        grades: { type: array, items: { $ref: "#/components/schemas/Grade" } }
        is_public: { type: boolean }
        theme_id: { type: string }
        version: { type: integer, minimum: 1 }
        url_version: { type: integer, minimum: 1 }
        health: { $ref: "#/components/schemas/HealthView" }
        url: { type: string, format: uri }
        prompt: { type: string }
        description: { type: string }
        stack_db: { type: [string, "null"] }
        stack_backend: { type: [string, "null"] }
        stack_frontend: { type: [string, "null"] }
        stack_hosting: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AppDetailResponse:
      type: object
      additionalProperties: false
      required: [item, server_time]
      properties:
        item: { $ref: "#/components/schemas/AppDetail" }
        server_time: { type: string, format: date-time }
    AppInput:
      type: object
      additionalProperties: false
      required:
        [
          name,
          url,
          prompt,
          description,
          subject,
          grades,
          is_public,
          theme_id,
          stack_db,
          stack_backend,
          stack_frontend,
          stack_hosting,
        ]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        url: { type: string, minLength: 1, maxLength: 2048, format: uri }
        prompt: { type: string, minLength: 1, maxLength: 30000 }
        description: { type: string, minLength: 1, maxLength: 20000 }
        subject: { $ref: "#/components/schemas/Subject" }
        grades:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: "#/components/schemas/Grade" }
        is_public: { type: boolean }
        theme_id: { type: string }
        stack_db: { type: [string, "null"], maxLength: 200 }
        stack_backend: { type: [string, "null"], maxLength: 200 }
        stack_frontend: { type: [string, "null"], maxLength: 200 }
        stack_hosting: { type: [string, "null"], maxLength: 200 }
