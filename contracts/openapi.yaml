          issued_at,
          expires_at,
          state,
          db_applied_at,
          finalized_at,
          result_version,
          rejection_code,
          server_time,
        ]
      properties:
        key: { type: string, format: uuid }
        kind: { type: string, enum: [app_create, app_update, app_delete] }
        target_id: { type: [string, "null"], format: uuid }
