openapi: 3.1.0
info:
  title: EduVibe Archive API
  version: 1.0.0
  description: Phase 1 public catalog reads and mock registration contract.
servers:
  - url: /api/v1
paths:
  /healthz:
    get:
      operationId: getLiveness
      summary: Check API process liveness
      description: Returns process liveness without database details.
      servers:
        - url: /
      security: []
      responses:
        "200":
          description: The API process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivenessResponse"
  /readyz:
    get:
      operationId: getReadiness
      summary: Check database and migration readiness
      description: Returns only whether the database matches the current migration head and authentication reconciliation and cleanup succeeded.
      servers:
        - url: /
      security: []
      responses:
        "200":
          description: The database is ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
        "503":
          description: The database is not ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotReadyResponse"
  /auth/flows:
    post:
      operationId: createAuthFlow
      summary: Allocate a new authentication flow identity
      description: >-
        Authentication parsing errors are 400 BAD_REQUEST; the 16KiB body limit
        returns 413 PAYLOAD_TOO_LARGE; field/context validation is 422
        VALIDATION_ERROR. Across authentication endpoints, missing current S
        is 401 AUTH_REQUIRED; missing or invalid required R is 401
        RECOVERY_REQUIRED and does not revoke S.
      security: []
      parameters:
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAuthFlowInput" }
      responses:
        "201":
          description: New flow identity; no credential is issued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthFlowCreated" }
        "409": { $ref: "#/components/responses/ServiceError" }
        "429": { $ref: "#/components/responses/ServiceError" }
        "503": { $ref: "#/components/responses/ServiceError" }
        "400": { $ref: "#/components/responses/ServiceError" }
        "422": { $ref: "#/components/responses/ServiceError" }
        "403": { $ref: "#/components/responses/ServiceError" }
        "413": { $ref: "#/components/responses/ServiceError" }
  /auth/flows/{flow_id}/recovery-cookie:
    post:
      operationId: issueRecoveryCookie
      summary: Issue the first recovery credential for an unprepared flow
      security: []
      parameters:
        - $ref: "#/components/parameters/FlowPathId"
        - $ref: "#/components/parameters/Origin"
      responses:
        "201":
          description: A new non-persistent recovery cookie was issued.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryCookieResult" }
        "409": { $ref: "#/components/responses/ServiceError" }
        "429": { $ref: "#/components/responses/ServiceError" }
        "503": { $ref: "#/components/responses/ServiceError" }
        "400": { $ref: "#/components/responses/ServiceError" }
        "422": { $ref: "#/components/responses/ServiceError" }
        "403": { $ref: "#/components/responses/ServiceError" }
        "413": { $ref: "#/components/responses/ServiceError" }
  /auth/flows/{flow_id}/ready:
    post:
      operationId: confirmRecoveryCookie
      summary: Confirm that the current recovery cookie was received
      security:
        - RecoveryCookie: []
      parameters:
        - $ref: "#/components/parameters/FlowPathId"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExpectedRevisionInput" }
      responses:
        "200":
          description: Recovery credential receipt confirmed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryReady" }
        "401": { $ref: "#/components/responses/ServiceError" }
        "409": { $ref: "#/components/responses/ServiceError" }
        "503": { $ref: "#/components/responses/ServiceError" }
        "400": { $ref: "#/components/responses/ServiceError" }
        "422": { $ref: "#/components/responses/ServiceError" }
        "403": { $ref: "#/components/responses/ServiceError" }
        "413": { $ref: "#/components/responses/ServiceError" }
  /auth/flows/{flow_id}/abandon:
    post:
      operationId: abandonAuthFlow
      summary: Abandon only a flow that was never marked ready
      security: []
      parameters:
        - $ref: "#/components/parameters/FlowPathId"
        - $ref: "#/components/parameters/Origin"
      responses:
        "200":
          description: The unprepared flow may be replaced.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RestartEligibility" }
        "409": { $ref: "#/components/responses/ServiceError" }
        "503": { $ref: "#/components/responses/ServiceError" }
        "400": { $ref: "#/components/responses/ServiceError" }
        "422": { $ref: "#/components/responses/ServiceError" }
        "403": { $ref: "#/components/responses/ServiceError" }
        "413": { $ref: "#/components/responses/ServiceError" }
        "429": { $ref: "#/components/responses/ServiceError" }
  /auth/recovery-context:
    get:
      operationId: getAuthRecoveryContext
      summary: Find only flows proved by a current recovery or session credential
      security:
        - RecoveryCookie: []
        - SessionCookie: []
      responses:
        "200":
          description: Proved flow IDs only; no member or transition result data.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryContext" }
        "401": { $ref: "#/components/responses/ServiceError" }
        "503": { $ref: "#/components/responses/ServiceError" }
        "400": { $ref: "#/components/responses/ServiceError" }
        "422": { $ref: "#/components/responses/ServiceError" }
  /auth/flows/{flow_id}/recovery-csrf:
    get:
      operationId: getRecoveryCsrf
      summary: Read the existing recovery CSRF token without rotating it
      security:
        - RecoveryCookie: []
      parameters:
        - $ref: "#/components/parameters/FlowPathId"
      responses:
        "200":
          description: Existing recovery CSRF token; no lifetime extension.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryCsrf" }
        "401": { $ref: "#/components/responses/ServiceError" }
        "503": { $ref: "#/components/responses/ServiceError" }
        "400": { $ref: "#/components/responses/ServiceError" }
        "422": { $ref: "#/components/responses/ServiceError" }
  /auth/flows/{flow_id}/recovery-cookie/rotate:
    post:
      operationId: rotateRecoveryCookie
      summary: Rotate recovery proof using any valid current session
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/FlowPathId"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RotateRecoveryCookieInput" }
      responses:
        "201":
          description: A new recovery credential; current session and expiry are preserved.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryCookieResult" }
        "401": { $ref: "#/components/responses/ServiceError" }
        "409": { $ref: "#/components/responses/ServiceError" }
        "503": { $ref: "#/components/responses/ServiceError" }
        "400": { $ref: "#/components/responses/ServiceError" }
        "422": { $ref: "#/components/responses/ServiceError" }
        "403": { $ref: "#/components/responses/ServiceError" }
        "413": { $ref: "#/components/responses/ServiceError" }
  /auth/flows/{flow_id}/restart-eligibility:
    get:
      operationId: getRestartEligibility
      summary: Check whether an unproved flow can safely be replaced
      security: []
      parameters:
        - $ref: "#/components/parameters/FlowPathId"
      responses:
        "200":
          description: Eligibility only; no flow mutation or result lookup.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RestartEligibility" }
        "404": { $ref: "#/components/responses/ServiceError" }
        "503": { $ref: "#/components/responses/ServiceError" }
        "400": { $ref: "#/components/responses/ServiceError" }
        "422": { $ref: "#/components/responses/ServiceError" }
  /auth/transitions:
    post:
      operationId: admitAuthTransition
      summary: Admit one authentication transition at an expected flow revision
      security:
        - SessionCookie: []
        - RecoveryCookie: []
      parameters:
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/AuthTransitionAdmissionInput" }
      responses:
        "201":
          description: One-use transition permit; credentials and request body are not stored.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthTransitionPermit" }
        "401": { $ref: "#/components/responses/ServiceError" }
        "409": { $ref: "#/components/responses/ServiceError" }
        "429": { $ref: "#/components/responses/ServiceError" }
        "503": { $ref: "#/components/responses/ServiceError" }
        "400": { $ref: "#/components/responses/ServiceError" }
        "422": { $ref: "#/components/responses/ServiceError" }
        "403": { $ref: "#/components/responses/ServiceError" }
        "413": { $ref: "#/components/responses/ServiceError" }
  /auth/transitions/{transition_id}/settle:
    post:
      operationId: settleAuthTransition
      summary: Block late execution and settle or report an unavailable result
      security:
        - RecoveryCookie: []
      parameters:
        - $ref: "#/components/parameters/TransitionPathId"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SettleAuthTransitionInput" }
      responses:
        "200":
          description: Safe terminal summary; prior success is never rolled back.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettledAuthTransition" }
        "401": { $ref: "#/components/responses/ServiceError" }
        "409": { $ref: "#/components/responses/ServiceError" }
        "503": { $ref: "#/components/responses/ServiceError" }
        "400": { $ref: "#/components/responses/ServiceError" }
        "422": { $ref: "#/components/responses/ServiceError" }
        "403": { $ref: "#/components/responses/ServiceError" }
        "413": { $ref: "#/components/responses/ServiceError" }
  /auth/transitions/{transition_id}/discard-session:
    post:
      operationId: discardAuthTransitionSession
      summary: Discard only the session issued by a successful transition but not received
      security:
        - RecoveryCookie: []
      parameters:
        - $ref: "#/components/parameters/TransitionPathId"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DiscardAuthSessionInput" }
      responses:
        "200":
          description: The exact missing session was discarded; other generations are unchanged.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlowRevision" }
        "401": { $ref: "#/components/responses/ServiceError" }
        "409": { $ref: "#/components/responses/ServiceError" }
        "503": { $ref: "#/components/responses/ServiceError" }
        "400": { $ref: "#/components/responses/ServiceError" }
        "422": { $ref: "#/components/responses/ServiceError" }
        "403": { $ref: "#/components/responses/ServiceError" }
        "413": { $ref: "#/components/responses/ServiceError" }
  /auth/flows/{flow_id}/reset:
    post:
      operationId: resetAuthFlow
      summary: Explicitly reset only the flow proved by the supplied cookie
      security:
        - RecoveryCookie: []
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/FlowPathId"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResetAuthFlowInput" }
      responses:
        "200":
          description: The proved flow was ended and can be restarted.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RestartEligibility" }
        "401": { $ref: "#/components/responses/ServiceError" }
        "409": { $ref: "#/components/responses/ServiceError" }
        "503": { $ref: "#/components/responses/ServiceError" }
        "400": { $ref: "#/components/responses/ServiceError" }
        "422": { $ref: "#/components/responses/ServiceError" }
        "403": { $ref: "#/components/responses/ServiceError" }
        "413": { $ref: "#/components/responses/ServiceError" }
  /auth/anonymous-session:
    post:
      operationId: issueAnonymousSession
      summary: Issue the first anonymous session after recovery preparation
      security:
        - RecoveryCookie: []
      parameters:
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/AuthFlowId"
        - $ref: "#/components/parameters/AuthRevision"
        - $ref: "#/components/parameters/TransitionId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExpectedRevisionInput" }
      responses:
        "201":
          description: Anonymous session and its current CSRF token.
          headers:
            X-EduVibe-Flow-Id: { schema: { type: string, format: uuid } }
            X-EduVibe-Auth-Revision:
              { schema: { type: string, pattern: "^(0|[1-9][0-9]*)$" } }
            X-EduVibe-Session-Generation:
              { schema: { type: string, pattern: "^(0|[1-9][0-9]*)$" } }
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnonymousSessionResult" }
        "401": { $ref: "#/components/responses/ServiceError" }
        "409": { $ref: "#/components/responses/ServiceError" }
        "503": { $ref: "#/components/responses/ServiceError" }
        "400": { $ref: "#/components/responses/ServiceError" }
        "422": { $ref: "#/components/responses/ServiceError" }
        "403": { $ref: "#/components/responses/ServiceError" }
        "413": { $ref: "#/components/responses/ServiceError" }
        "429": { $ref: "#/components/responses/ServiceError" }
  /auth/csrf:
    get:
      operationId: getAuthCsrf
      summary: Read the current session CSRF token without starting a new session
      description: >-
        Reads only an existing valid session. Initial anonymous-session
        preparation uses POST /auth/anonymous-session.
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/AuthFlowId"
      responses:
        "200":
          description: Current CSRF token and expiry.
          headers:
            X-EduVibe-Flow-Id: { schema: { type: string, format: uuid } }
            X-EduVibe-Auth-Revision:
              { schema: { type: string, pattern: "^(0|[1-9][0-9]*)$" } }
            X-EduVibe-Session-Generation:
              { schema: { type: string, pattern: "^(0|[1-9][0-9]*)$" } }
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfToken"
        "401":
          $ref: "#/components/responses/ServiceError"
        "503":
          $ref: "#/components/responses/ServiceError"
        "400": { $ref: "#/components/responses/ServiceError" }
        "422": { $ref: "#/components/responses/ServiceError" }
        "409": { $ref: "#/components/responses/ServiceError" }
  /auth/me:
    get:
      operationId: getAuthMe
      summary: Restore the current authenticated member
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/AuthFlowId"
        - $ref: "#/components/parameters/AuthRevision"
        - $ref: "#/components/parameters/SessionGeneration"
      responses:
        "200":
          description: The current member; contact fields are excluded or null.
          headers:
            X-EduVibe-Flow-Id: { schema: { type: string, format: uuid } }
            X-EduVibe-Auth-Revision:
              { schema: { type: string, pattern: "^(0|[1-9][0-9]*)$" } }
            X-EduVibe-Session-Generation:
              { schema: { type: string, pattern: "^(0|[1-9][0-9]*)$" } }
            Cache-Control:
              { schema: { type: string, const: "private, no-store" } }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Self"
        "401":
          $ref: "#/components/responses/ServiceError"
        "503":
          $ref: "#/components/responses/ServiceError"
        "400": { $ref: "#/components/responses/ServiceError" }
        "422": { $ref: "#/components/responses/ServiceError" }
        "409": { $ref: "#/components/responses/ServiceError" }
  /auth/flow-state:
    get:
      operationId: getAuthFlowState
      summary: Read current authentication flow metadata
      description: >-
        Reads the current flow, selected session, pending transition, and an
        optional requested transition result. Unavailable results are distinct
        from terminal transition states.
      security:
        - RecoveryCookie: []
      parameters:
        - name: X-EduVibe-Flow-Id
          in: header
          required: true
          schema: { type: string, format: uuid }
        - name: transition_id
          in: query
          required: false
          schema: { type: string, pattern: "^[0-9a-f-]{36}\\.(0|[1-9][0-9]*)$" }
      responses:
        "200":
          description: Current authentication flow identity and sequence.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthFlowState"
        "401":
          $ref: "#/components/responses/ServiceError"
        "503":
          $ref: "#/components/responses/ServiceError"
        "400": { $ref: "#/components/responses/ServiceError" }
        "422": { $ref: "#/components/responses/ServiceError" }
        "409": { $ref: "#/components/responses/ServiceError" }
  /auth/login:
    post:
      operationId: login
      summary: Sign in an approved member
      description: >-
        Verifies the existing credential after a login permit. The response
        alone never opens a protected screen; clients confirm flow-state, then
        read /auth/me. A wrong, unknown or deleted account is one
        INVALID_CREDENTIALS response; only the exact password learns
        ACCOUNT_NOT_APPROVED or TEMP_PASSWORD_EXPIRED.
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/AuthFlowId"
        - $ref: "#/components/parameters/AuthRevision"
        - $ref: "#/components/parameters/SessionGeneration"
        - $ref: "#/components/parameters/TransitionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated member and rotated CSRF token.
          headers:
            X-EduVibe-Flow-Id: { schema: { type: string, format: uuid } }
            X-EduVibe-Auth-Revision:
              { schema: { type: string, pattern: "^(0|[1-9][0-9]*)$" } }
            X-EduVibe-Session-Generation:
              { schema: { type: string, pattern: "^(0|[1-9][0-9]*)$" } }
            Cache-Control:
              { schema: { type: string, const: "private, no-store" } }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "401":
          $ref: "#/components/responses/ServiceError"
        "403":
          $ref: "#/components/responses/ServiceError"
        "409":
          $ref: "#/components/responses/ServiceError"
        "429":
          $ref: "#/components/responses/ServiceError"
        "503":
          description: >-
            A controlled outage. AUTH_BUSY (hashing saturated) carries
            Retry-After: 1; DB_BUSY follows the five-second lock cap.
          headers:
            Retry-After: { schema: { type: string } }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "400": { $ref: "#/components/responses/ServiceError" }
        "422": { $ref: "#/components/responses/ServiceError" }
        "413": { $ref: "#/components/responses/ServiceError" }
  /auth/register:
    post:
      operationId: register
      summary: Submit a member registration for manual approval
      description: >-
        Creates an unapproved user and never signs the user in. The
        password_confirm field is not accepted. While contact collection is
        disabled, omitted, null, or normalized-empty email/phone values are
        accepted and non-empty values receive field validation errors. No
        partial account is created on validation failure. T04 is enabled only in
        the APP_ENV=test prepared boundary until T05 completes. Requires the
        current anonymous S and matching flow/revision/generation; full and
        change_only receive ALREADY_AUTHENTICATED. Registration does not admit
        an identity transition, rotate S, or sign in. Origin/CSRF-valid attempts,
        including field errors and duplicates, reserve one of 100 IP slots per
        rolling hour atomically before hashing. Blocked requests do not extend
        the window. Final commit rechecks the current anonymous context.
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/AuthFlowId"
        - $ref: "#/components/parameters/AuthRevision"
        - $ref: "#/components/parameters/SessionGeneration"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Unapproved account and calculated pending expiry; the anonymous S is unchanged.
          headers:
            X-EduVibe-Flow-Id: { schema: { type: string, format: uuid } }
            X-EduVibe-Auth-Revision:
              { schema: { type: string, pattern: "^(0|[1-9][0-9]*)$" } }
            X-EduVibe-Session-Generation:
              { schema: { type: string, pattern: "^(0|[1-9][0-9]*)$" } }
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisteredUser"
        "400":
          $ref: "#/components/responses/ServiceError"
        "401":
          $ref: "#/components/responses/ServiceError"
        "403":
          $ref: "#/components/responses/ServiceError"
        "409":
          $ref: "#/components/responses/ServiceError"
        "413":
          $ref: "#/components/responses/ServiceError"
        "422":
          $ref: "#/components/responses/ServiceError"
        "429":
          $ref: "#/components/responses/ServiceError"
        "503":
          $ref: "#/components/responses/ServiceError"
  /auth/password:
    post:
      operationId: changePassword
      summary: Replace the temporary password in a change-only session
      description: >-
        Requires a valid change-only session. The password is normalized to NFC
        without trimming; confirmation stays in the browser and is not sent.
        The request is rejected when the temporary credential or session has
        expired, including at the exact expiry boundary. The full session is
        rejected with SESSION_KIND_NOT_ALLOWED. Final commit rechecks the
        temporary credential, member version, current session, flow and permit.
        A successful change consumes the temporary credential and revokes other
        change-only sessions; only this browser receives a new full session.
        A lost reply is recovered through the original transition result, never
        by replaying the password change.
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/AuthFlowId"
        - $ref: "#/components/parameters/AuthRevision"
        - $ref: "#/components/parameters/SessionGeneration"
        - $ref: "#/components/parameters/TransitionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      responses:
        "200":
          description: The temporary credential is consumed and a full session is issued.
          headers:
            X-EduVibe-Flow-Id: { schema: { type: string, format: uuid } }
            X-EduVibe-Auth-Revision:
              { schema: { type: string, pattern: "^(0|[1-9][0-9]*)$" } }
            X-EduVibe-Session-Generation:
              { schema: { type: string, pattern: "^(0|[1-9][0-9]*)$" } }
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "401":
          $ref: "#/components/responses/ServiceError"
        "403":
          $ref: "#/components/responses/ServiceError"
        "422":
          $ref: "#/components/responses/ServiceError"
        "503":
          $ref: "#/components/responses/ServiceError"
        "400": { $ref: "#/components/responses/ServiceError" }
        "413": { $ref: "#/components/responses/ServiceError" }
        "409": { $ref: "#/components/responses/ServiceError" }
  /auth/logout:
    post:
      operationId: logout
      summary: Sign out the current browser session
      description: >-
        Without a valid current S, Origin validation alone permits 204 and
        neither issues an anonymous session nor settles another transition.
        With a valid current S, its CSRF, flow, revision, session generation
        and admitted transition are required.
      security:
        - {}
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Origin"
        - name: X-CSRF-Token
          in: header
          required: false
          description: Required only when a valid current S exists.
          schema: { type: string, minLength: 1 }
        - name: X-EduVibe-Flow-Id
          in: header
          required: false
          description: Required only when a valid current S exists.
          schema: { type: string, format: uuid }
        - name: X-EduVibe-Auth-Revision
          in: header
          required: false
          description: Required only when a valid current S exists.
          schema: { type: string, pattern: "^(0|[1-9][0-9]*)$" }
        - name: X-EduVibe-Session-Generation
          in: header
          required: false
          description: Required only when a valid current S exists.
          schema: { type: string, pattern: "^(0|[1-9][0-9]*)$" }
        - name: X-EduVibe-Transition-Id
          in: header
          required: false
          description: Required only when a valid current S exists.
          schema: { type: string, minLength: 1 }
      responses:
        "204":
          description: The current session was cleared or was already anonymous.
        "403":
          $ref: "#/components/responses/ServiceError"
        "503":
          $ref: "#/components/responses/ServiceError"
        "400": { $ref: "#/components/responses/ServiceError" }
        "422": { $ref: "#/components/responses/ServiceError" }
        "413": { $ref: "#/components/responses/ServiceError" }
        "409": { $ref: "#/components/responses/ServiceError" }
  /auth/reauth:
    post:
      operationId: reauthenticate
      summary: Reauthenticate the current administrator without extending the absolute session expiry
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/AuthFlowId"
        - $ref: "#/components/parameters/AuthRevision"
        - $ref: "#/components/parameters/SessionGeneration"
        - $ref: "#/components/parameters/TransitionId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReauthenticateInput" }
      responses:
        "200":
          description: Current administrator session and CSRF are rotated.
          headers:
            X-EduVibe-Flow-Id: { schema: { type: string, format: uuid } }
            X-EduVibe-Auth-Revision:
              { schema: { type: string, pattern: "^(0|[1-9][0-9]*)$" } }
            X-EduVibe-Session-Generation:
              { schema: { type: string, pattern: "^(0|[1-9][0-9]*)$" } }
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResult" }
        "401": { $ref: "#/components/responses/ServiceError" }
        "403": { $ref: "#/components/responses/ServiceError" }
        "409": { $ref: "#/components/responses/ServiceError" }
        "503": { $ref: "#/components/responses/ServiceError" }
        "400": { $ref: "#/components/responses/ServiceError" }
        "422": { $ref: "#/components/responses/ServiceError" }
        "413": { $ref: "#/components/responses/ServiceError" }
  /meta:
    get:
      operationId: getMeta
      summary: Read public catalog metadata
      description: >-
        Headerless metadata discovery is independent of authentication. If any
        connection header is supplied, all three must be canonical; otherwise 422.
      security: []
      parameters:
        - name: X-EduVibe-Flow-Id
          in: header
          required: false
          schema: { type: string }
        - name: X-EduVibe-Auth-Revision
          in: header
          required: false
          schema: { type: string }
        - name: X-EduVibe-Session-Generation
          in: header
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Public catalog metadata and feature availability.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meta"
        "400":
          $ref: "#/components/responses/ServiceError"
        "422":
          $ref: "#/components/responses/ServiceError"
        "503":
          $ref: "#/components/responses/ServiceError"
  /apps:
    get:
      operationId: listPublicApps
      summary: List public archive apps
      description: >-
        Returns publicly accessible apps ordered by created_at descending, then
        id descending. Subject facets describe the full accessible set and do
        not depend on search, grade, or page offset. Reject repeated and unknown
        query parameters.
      security: []
      parameters:
        - name: X-EduVibe-Flow-Id
          in: header
          required: false
          schema: { type: string }
        - name: X-EduVibe-Auth-Revision
          in: header
          required: false
          schema: { type: string }
        - name: X-EduVibe-Session-Generation
          in: header
          required: false
          schema: { type: string }
        - name: q
          in: query
          description: >-
            Trim, normalize to NFC, then apply Unicode default case folding.
            Count the post-folded value in Unicode code points; reject values
            longer than 100 without truncation. Search name, author nickname,
            and description as separate substring fields. Treat percent and
            underscore literally; do not search login IDs or contact fields.
          schema: { type: string }
        - name: subject
          in: query
          description: Empty omits the filter; otherwise use one catalog value.
          schema:
            anyOf:
              - type: string
                enum: [""]
              - $ref: "#/components/schemas/Subject"
        - name: grade
          in: query
          description: Empty omits the filter; otherwise use one catalog value.
          schema:
            anyOf:
              - type: string
                enum: [""]
              - $ref: "#/components/schemas/Grade"
        - name: limit
          in: query
          description: Page size; defaults to 24 and cannot exceed 100.
          schema: { type: integer, minimum: 1, maximum: 100, default: 24 }
        - name: offset
          in: query
          description: Zero-based offset. A valid offset past the result count returns an empty page.
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: A page of public app cards.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppPage"
        "400":
          $ref: "#/components/responses/ServiceError"
        "409":
          $ref: "#/components/responses/ServiceError"
        "422":
          $ref: "#/components/responses/ServiceError"
        "503":
          $ref: "#/components/responses/ServiceError"
    post:
      operationId: createApp
      summary: Create an archive app with an issued operation key
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/AuthFlowId"
        - $ref: "#/components/parameters/AuthRevision"
        - $ref: "#/components/parameters/SessionGeneration"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppInput" }
      responses:
        "201":
          description: The persisted app and its current owner.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppDetailResponse" }
        "400": { $ref: "#/components/responses/ServiceError" }
        "401": { $ref: "#/components/responses/ServiceError" }
        "403": { $ref: "#/components/responses/ServiceError" }
        "404": { $ref: "#/components/responses/ServiceError" }
        "409": { $ref: "#/components/responses/ServiceError" }
        "410": { $ref: "#/components/responses/ServiceError" }
        "422": { $ref: "#/components/responses/ServiceError" }
        "429": { $ref: "#/components/responses/ServiceError" }
        "503": { $ref: "#/components/responses/ServiceError" }
  /apps/{id}:
    get:
      operationId: getApp
      summary: Read an archive app available to the current member
      security:
        - {}
        - SessionCookie: []
      parameters:
        - name: X-EduVibe-Flow-Id
          in: header
          required: false
          schema: { type: string }
        - name: X-EduVibe-Auth-Revision
          in: header
          required: false
          schema: { type: string }
        - name: X-EduVibe-Session-Generation
          in: header
          required: false
          schema: { type: string }
        - name: id
          in: path
          required: true
          description: >-
            Canonical 8-4-4-4-12 hexadecimal UUID with version 1-8 and variant
            8/9/a/b. Hex is case-insensitive and normalized to lowercase.
            Other formats return 404 NOT_FOUND; query errors take precedence.
          schema:
            type: string
            format: uuid
            pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
            minLength: 36
            maxLength: 36
      responses:
        "200":
          description: >-
            Public detail, or private detail authorized for the current approved
            full owner or full administrator. Headerless requests ignore cookies.
            Supplied context is all-or-none and canonical; stale or pending context
            is rejected without replay. Missing and unauthorized detail share 404.
            Member-bound responses include verified context and are never cached.
          headers:
            Cache-Control:
              description: Present on member-bound responses only.
              schema: { type: string, const: "private, no-store" }
            X-EduVibe-Flow-Id:
              description: Verified flow ID, present on member-bound responses only.
              schema: { type: string, format: uuid }
            X-EduVibe-Auth-Revision:
              description: Verified revision, present on member-bound responses only.
              schema: { type: string }
            X-EduVibe-Session-Generation:
              description: Verified generation, present on member-bound responses only.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppDetailResponse"
        "400":
          $ref: "#/components/responses/ServiceError"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/ServiceError"
        "403":
          $ref: "#/components/responses/ServiceError"
        "409":
          $ref: "#/components/responses/ServiceError"
        "422":
          $ref: "#/components/responses/ServiceError"
        "503":
          $ref: "#/components/responses/ServiceError"
    patch:
      operationId: updateApp
      summary: Update an owned archive app at its expected version
      security:
        - SessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/AuthFlowId"
        - $ref: "#/components/parameters/AuthRevision"
        - $ref: "#/components/parameters/SessionGeneration"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateAppInput" }
      responses:
        "200":
          description: The persisted app at its new version.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppDetailResponse" }
        "400": { $ref: "#/components/responses/ServiceError" }
        "401": { $ref: "#/components/responses/ServiceError" }
        "403": { $ref: "#/components/responses/ServiceError" }
        "404": { $ref: "#/components/responses/ServiceError" }
        "409": { $ref: "#/components/responses/ServiceError" }
        "410": { $ref: "#/components/responses/ServiceError" }
        "422": { $ref: "#/components/responses/ServiceError" }
        "429": { $ref: "#/components/responses/ServiceError" }
        "503": { $ref: "#/components/responses/ServiceError" }
    delete:
      operationId: deleteApp
      summary: Delete an owned archive app at its expected version
      security:
        - SessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/AuthFlowId"
        - $ref: "#/components/parameters/AuthRevision"
        - $ref: "#/components/parameters/SessionGeneration"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeleteAppInput" }
      responses:
        "204":
          description: The app and its related health result and jobs were deleted.
        "400": { $ref: "#/components/responses/ServiceError" }
        "401": { $ref: "#/components/responses/ServiceError" }
        "403": { $ref: "#/components/responses/ServiceError" }
        "404": { $ref: "#/components/responses/ServiceError" }
        "409": { $ref: "#/components/responses/ServiceError" }
        "410": { $ref: "#/components/responses/ServiceError" }
        "422": { $ref: "#/components/responses/ServiceError" }
        "429": { $ref: "#/components/responses/ServiceError" }
        "503":
          $ref: "#/components/responses/ServiceError"
          description: >-
            Includes DELETION_CONFIRMATION_PENDING when the app deletion is
            committed but its related deletion record is not yet confirmed.
            Check the existing operation key; do not submit a new key.
  /apps/{id}/health:
    get:
      operationId: getAppHealth
      summary: Read the current connection result and latest check job
      description: >-
        Requires current permission to read the app. This read never starts a
        new external check. Administrator-only measurement fields are omitted
        for other viewers.
      security:
        - {}
        - SessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Current result, freshness, and latest job.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthSnapshot" }
        "401": { $ref: "#/components/responses/ServiceError" }
        "403": { $ref: "#/components/responses/ServiceError" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceError" }
  /apps/{id}/health-checks:
    post:
      operationId: requestAppHealthCheck
      summary: Request an individual connection check
      description: >-
        Requires a current session and CSRF proof. A public app may be checked
        from an anonymous session; a private app requires current read access.
        This endpoint accepts no arbitrary URL. New and active-reused jobs use
        202; completed-result reuse uses 200. No browser request is sent to the
        external site.
      security:
        - SessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/AuthFlowId"
        - $ref: "#/components/parameters/AuthRevision"
        - $ref: "#/components/parameters/SessionGeneration"
      responses:
        "200":
          description: A result for the current URL was reused; no new check started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckAccepted" }
        "202":
          description: A new job was accepted or an active job was reused.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckAccepted" }
        "401": { $ref: "#/components/responses/ServiceError" }
        "403": { $ref: "#/components/responses/ServiceError" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ServiceError" }
        "429": { $ref: "#/components/responses/ServiceError" }
        "503": { $ref: "#/components/responses/ServiceError" }
  /health-checks/{id}:
    get:
      operationId: getHealthCheckJob
      summary: Read one check job and its current app result
      description: >-
        Requires current permission to read the associated app. This read never
        starts a new external check. The requested job and latest app result
        remain separate values.
      security:
        - {}
        - SessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The requested job and current health snapshot.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthJobResponse" }
        "401": { $ref: "#/components/responses/ServiceError" }
        "403": { $ref: "#/components/responses/ServiceError" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceError" }
  /admin/health-check-batches:
    post:
      operationId: requestAdminHealthBatch
      summary: Start or rediscover the current administrator health batch
      description: >-
        Requires the current administrator session and CSRF proof. A new batch
        fixes the complete app target set at acceptance; an active batch is
        reused. A completed batch cannot be replaced until five minutes after
        its creation. The response contains aggregate progress only.
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/AuthFlowId"
        - $ref: "#/components/parameters/AuthRevision"
        - $ref: "#/components/parameters/SessionGeneration"
      responses:
        "202":
          description: A new batch was accepted or the active batch was reused.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BatchAccepted" }
        "401": { $ref: "#/components/responses/ServiceError" }
        "403": { $ref: "#/components/responses/ServiceError" }
        "409": { $ref: "#/components/responses/ServiceError" }
        "429": { $ref: "#/components/responses/ServiceError" }
        "503": { $ref: "#/components/responses/ServiceError" }
  /admin/health-check-batches/{id}:
    get:
      operationId: getAdminHealthBatch
      summary: Read one administrator health batch
      description: >-
        Requires the current administrator session. This read is safe to repeat
        and never starts external checks.
      security:
        - SessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/AuthFlowId"
        - $ref: "#/components/parameters/AuthRevision"
        - $ref: "#/components/parameters/SessionGeneration"
      responses:
        "200":
          description: Current fixed-target batch counts and status.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthBatch" }
        "401": { $ref: "#/components/responses/ServiceError" }
        "403": { $ref: "#/components/responses/ServiceError" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ServiceError" }
        "503": { $ref: "#/components/responses/ServiceError" }
  /admin/users:
    get:
      operationId: listAdminUsers
      summary: List users and aggregate dashboard statistics
      description: >-
        Pending users sort first, then creation time and member ID ascending.
        The page always carries aggregates for the full authorized member set.
      security:
        - SessionCookie: []
      parameters:
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 24 },
          }
        - {
            name: offset,
            in: query,
            schema: { type: integer, minimum: 0, maximum: 9007199254740991, default: 0 },
          }
        - $ref: "#/components/parameters/AuthFlowId"
        - $ref: "#/components/parameters/AuthRevision"
        - $ref: "#/components/parameters/SessionGeneration"
      responses:
        "200":
          description: An offset page and aggregate statistics for all users/apps.
          headers:
            Cache-Control: { schema: { type: string, const: "private, no-store" } }
            X-EduVibe-Flow-Id: { schema: { type: string, format: uuid } }
            X-EduVibe-Auth-Revision: { schema: { type: string, pattern: "^(0|[1-9][0-9]*)$" } }
            X-EduVibe-Session-Generation: { schema: { type: string, pattern: "^(0|[1-9][0-9]*)$" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserPage" }
        "401": { $ref: "#/components/responses/ServiceError" }
        "403": { $ref: "#/components/responses/ServiceError" }
        "409": { $ref: "#/components/responses/ServiceError" }
        "503": { $ref: "#/components/responses/ServiceError" }
  /admin/apps:
    get:
      operationId: listAdminApps
      summary: List all public and private apps for the administrator monitor
      description: >-
        Returns only the app name, URL, visibility, theme, versions, creation
        time, author nickname, and connection result summary. Prompts,
        descriptions, and member contact fields are never included. Items sort
        by creation time descending and app ID descending.
      security:
        - SessionCookie: []
      parameters:
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 24 },
          }
        - {
            name: offset,
            in: query,
            schema: { type: integer, minimum: 0, default: 0 },
          }
        - $ref: "#/components/parameters/AuthFlowId"
        - $ref: "#/components/parameters/AuthRevision"
        - $ref: "#/components/parameters/SessionGeneration"
      responses:
        "200":
          description: A page of all authorized apps with only monitor fields.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAppPage" }
        "401": { $ref: "#/components/responses/ServiceError" }
        "403": { $ref: "#/components/responses/ServiceError" }
        "409": { $ref: "#/components/responses/ServiceError" }
        "503": { $ref: "#/components/responses/ServiceError" }
  /admin/users/{id}:
    get:
      operationId: getAdminUser
      summary: Read an approval target with its current account version
      security:
        - SessionCookie: []
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
        - $ref: "#/components/parameters/AuthFlowId"
        - $ref: "#/components/parameters/AuthRevision"
        - $ref: "#/components/parameters/SessionGeneration"
      responses:
        "200":
          description: The current target without contact fields.
          headers:
            Cache-Control: { schema: { type: string, const: "private, no-store" } }
            X-EduVibe-Flow-Id: { schema: { type: string, format: uuid } }
            X-EduVibe-Auth-Revision: { schema: { type: string, pattern: "^(0|[1-9][0-9]*)$" } }
            X-EduVibe-Session-Generation: { schema: { type: string, pattern: "^(0|[1-9][0-9]*)$" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "401": { $ref: "#/components/responses/ServiceError" }
        "403": { $ref: "#/components/responses/ServiceError" }
        "404": { $ref: "#/components/responses/ServiceError" }
        "409": { $ref: "#/components/responses/ServiceError" }
        "503": { $ref: "#/components/responses/ServiceError" }
    delete:
      operationId: deleteAdminUser
      summary: Delete an ordinary member and all owned archive apps
      description: >-
        Requires current administrator reauthentication. The expected app count
        is checked when the operation key is issued and again when deletion is
        committed. A same-count change in app composition does not block the
        deletion. A 503 DELETION_CONFIRMATION_PENDING means account and app
        deletion committed; read the existing operation key and never infer
        failure or issue a new deletion.
      security:
        - SessionCookie: []
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/AuthFlowId"
        - $ref: "#/components/parameters/AuthRevision"
        - $ref: "#/components/parameters/SessionGeneration"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeleteAdminUserInput" }
      responses:
        "204":
          description: The member and all owned archive apps were deleted.
        "400": { $ref: "#/components/responses/ServiceError" }
        "401": { $ref: "#/components/responses/ServiceError" }
        "403": { $ref: "#/components/responses/ServiceError" }
        "404": { $ref: "#/components/responses/ServiceError" }
        "409": { $ref: "#/components/responses/ServiceError" }
        "410": { $ref: "#/components/responses/ServiceError" }
        "422": { $ref: "#/components/responses/ServiceError" }
        "503":
          $ref: "#/components/responses/ServiceError"
          description: >-
            Includes DELETION_CONFIRMATION_PENDING after account and app
            deletion commit. Read the existing operation key; do not delete
            again or use a new key.
  /write-operations:
    post:
      operationId: createWriteOperation
      summary: Issue a write operation key without changing app or account data
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/AuthFlowId"
        - $ref: "#/components/parameters/AuthRevision"
        - $ref: "#/components/parameters/SessionGeneration"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateWriteOperation" }
      responses:
        "201":
          description: An unresolved key result with no echoed business input.
          headers:
            Cache-Control: { schema: { type: string, const: "private, no-store" } }
            X-EduVibe-Flow-Id: { schema: { type: string, format: uuid } }
            X-EduVibe-Auth-Revision: { schema: { type: string, pattern: "^(0|[1-9][0-9]*)$" } }
            X-EduVibe-Session-Generation: { schema: { type: string, pattern: "^(0|[1-9][0-9]*)$" } }
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ApprovalOperation"
                  - $ref: "#/components/schemas/PasswordResetOperation"
                  - $ref: "#/components/schemas/UserDeleteOperation"
                  - $ref: "#/components/schemas/AppWriteOperation"
        "400": { $ref: "#/components/responses/ServiceError" }
        "401": { $ref: "#/components/responses/ServiceError" }
        "403": { $ref: "#/components/responses/ServiceError" }
        "404": { $ref: "#/components/responses/ServiceError" }
        "409": { $ref: "#/components/responses/ServiceError" }
        "413": { $ref: "#/components/responses/ServiceError" }
        "422": { $ref: "#/components/responses/ServiceError" }
        "503": { $ref: "#/components/responses/ServiceError" }
  /admin/users/{id}/approval:
    patch:
      operationId: setAdminUserApproval
      summary: Explicitly set the approval value for one current target version
      security:
        - SessionCookie: []
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
        - {
            name: Idempotency-Key,
            in: header,
            required: true,
            schema: { type: string, format: uuid },
          }
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/AuthFlowId"
        - $ref: "#/components/parameters/AuthRevision"
        - $ref: "#/components/parameters/SessionGeneration"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetApprovalInput" }
      responses:
        "200":
          description: The account state applied by this request.
          headers:
            Cache-Control: { schema: { type: string, const: "private, no-store" } }
            X-EduVibe-Flow-Id: { schema: { type: string, format: uuid } }
            X-EduVibe-Auth-Revision: { schema: { type: string, pattern: "^(0|[1-9][0-9]*)$" } }
            X-EduVibe-Session-Generation: { schema: { type: string, pattern: "^(0|[1-9][0-9]*)$" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "400": { $ref: "#/components/responses/ServiceError" }
        "401": { $ref: "#/components/responses/ServiceError" }
        "403": { $ref: "#/components/responses/ServiceError" }
        "404": { $ref: "#/components/responses/ServiceError" }
        "409": { $ref: "#/components/responses/ServiceError" }
        "410": { $ref: "#/components/responses/ServiceError" }
        "413": { $ref: "#/components/responses/ServiceError" }
        "422": { $ref: "#/components/responses/ServiceError" }
        "503": { $ref: "#/components/responses/ServiceError" }
  /admin/users/{id}/password-reset:
    post:
      operationId: resetAdminUserPassword
      summary: Set a current ordinary member password to an administrator supplied temporary password
      security:
        - SessionCookie: []
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
        - {
            name: Idempotency-Key,
            in: header,
            required: true,
            schema: { type: string, format: uuid },
          }
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/AuthFlowId"
        - $ref: "#/components/parameters/AuthRevision"
        - $ref: "#/components/parameters/SessionGeneration"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetPasswordResetInput" }
      responses:
        "204":
          description: The password was reset and the target's sessions were invalidated.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
        "400": { $ref: "#/components/responses/ServiceError" }
        "401": { $ref: "#/components/responses/ServiceError" }
        "403": { $ref: "#/components/responses/ServiceError" }
        "404": { $ref: "#/components/responses/ServiceError" }
        "409": { $ref: "#/components/responses/ServiceError" }
        "410": { $ref: "#/components/responses/ServiceError" }
        "413": { $ref: "#/components/responses/ServiceError" }
        "422": { $ref: "#/components/responses/ServiceError" }
        "503": { $ref: "#/components/responses/ServiceError" }
  /write-operations/{key}:
    get:
      operationId: getWriteOperation
      summary: Read the minimal result for a write operation key
      security:
        - SessionCookie: []
      parameters:
        - {
            name: key,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
        - $ref: "#/components/parameters/AuthFlowId"
        - $ref: "#/components/parameters/AuthRevision"
        - $ref: "#/components/parameters/SessionGeneration"
      responses:
        "200":
          description: Unresolved is not success; the result does not expose input.
          headers:
            Cache-Control: { schema: { type: string, const: "private, no-store" } }
            X-EduVibe-Flow-Id: { schema: { type: string, format: uuid } }
            X-EduVibe-Auth-Revision: { schema: { type: string, pattern: "^(0|[1-9][0-9]*)$" } }
            X-EduVibe-Session-Generation: { schema: { type: string, pattern: "^(0|[1-9][0-9]*)$" } }
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ApprovalOperation"
                  - $ref: "#/components/schemas/PasswordResetOperation"
                  - $ref: "#/components/schemas/UserDeleteOperation"
                  - $ref: "#/components/schemas/AppWriteOperation"
        "401": { $ref: "#/components/responses/ServiceError" }
        "403": { $ref: "#/components/responses/ServiceError" }
        "404": { $ref: "#/components/responses/ServiceError" }
        "409": { $ref: "#/components/responses/ServiceError" }
        "410": { $ref: "#/components/responses/ServiceError" }
        "503": { $ref: "#/components/responses/ServiceError" }
  /write-operations/{key}/cancel:
    post:
      operationId: cancelWriteOperation
      summary: Cancel an unresolved approval or password reset key
      security:
        - SessionCookie: []
      parameters:
        - {
            name: key,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/AuthFlowId"
        - $ref: "#/components/parameters/AuthRevision"
        - $ref: "#/components/parameters/SessionGeneration"
      responses:
        "200":
          description: The result after cancellation; a prior success is not rolled back.
          headers:
            Cache-Control: { schema: { type: string, const: "private, no-store" } }
            X-EduVibe-Flow-Id: { schema: { type: string, format: uuid } }
            X-EduVibe-Auth-Revision: { schema: { type: string, pattern: "^(0|[1-9][0-9]*)$" } }
            X-EduVibe-Session-Generation: { schema: { type: string, pattern: "^(0|[1-9][0-9]*)$" } }
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ApprovalOperation"
                  - $ref: "#/components/schemas/PasswordResetOperation"
        "400": { $ref: "#/components/responses/ServiceError" }
        "401": { $ref: "#/components/responses/ServiceError" }
        "403": { $ref: "#/components/responses/ServiceError" }
        "404": { $ref: "#/components/responses/ServiceError" }
        "409": { $ref: "#/components/responses/ServiceError" }
        "410": { $ref: "#/components/responses/ServiceError" }
        "413": { $ref: "#/components/responses/ServiceError" }
        "503": { $ref: "#/components/responses/ServiceError" }
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }
    FlowPathId:
      name: flow_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    TransitionPathId:
      name: transition_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9a-f-]{36}\\.(0|[1-9][0-9]*)$"
    Origin:
      name: Origin
      in: header
      required: true
      schema: { type: string, format: uri }
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string, minLength: 1 }
    AuthFlowId:
      name: X-EduVibe-Flow-Id
      in: header
      required: true
      schema: { type: string, format: uuid }
    AuthRevision:
      name: X-EduVibe-Auth-Revision
      in: header
      required: true
      schema: { type: string, pattern: "^(0|[1-9][0-9]*)$" }
    SessionGeneration:
      name: X-EduVibe-Session-Generation
      in: header
      required: true
      schema: { type: string, pattern: "^(0|[1-9][0-9]*)$" }
    TransitionId:
      name: X-EduVibe-Transition-Id
      in: header
      required: true
      schema:
        type: string
        pattern: "^[0-9a-f-]{36}\\.(0|[1-9][0-9]*)$"
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: __Host-eduvibe_session_<flow_id>_<issued_seq>
      description: >-
        Production cookies use a fresh name per flow and issued sequence.
        Explicit HTTP localhost/loopback development names are
        eduvibe_session_dev_<flow_id>_<issued_seq>.
    RecoveryCookie:
      type: apiKey
      in: cookie
      name: __Host-eduvibe_recovery_<flow_id>_<issued_seq>
      description: >-
        The name is generated per flow. The placeholders stand for the request's
        X-EduVibe-Flow-Id and the server-issued recovery sequence.
  responses:
    NotFound:
      description: The app does not exist or is not accessible to the current member.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ServiceError:
      description: The request failed or the response could not be accepted.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    Role:
      type: string
      enum: [user, admin]
    SessionKind:
      type: string
      enum: [full, change_only]
    LoginInput:
      type: object
      additionalProperties: false
      required: [login_id, password]
      properties:
        login_id:
          type: string
          minLength: 2
          maxLength: 32
          pattern: "^[가-힣A-Za-z0-9_.-]+$"
        password: { type: string, minLength: 1 }
    ChangePasswordInput:
      type: object
      additionalProperties: false
      required: [password]
      description: >-
        A new password of 15-128 Unicode code points. Normalize to NFC without
        trimming or truncation; compare the full normalized value against the
        versioned local common-password blocklist. Do not send it to an external
        service. The Phase 1 mock does not apply this check while list
        redistribution rights remain unresolved. T03 uses individually prepared,
        integrity-verified R15 data in the test environment. The browser confirmation is
        never sent.
      properties:
        password:
          type: string
          minLength: 15
          maxLength: 128
    RegisterInput:
      type: object
      additionalProperties: false
      required: [login_id, password, nickname]
      description: >-
        login_id and nickname are trimmed and normalized to NFC; password is
        normalized to NFC without trimming. Lengths count Unicode code points.
        Password length is 15-128. The production contract checks the full
        normalized value against the versioned local common-password blocklist;
        the Phase 1 mock does not apply the check while list redistribution
        rights remain unresolved. T04 uses individually prepared integrity-verified
        R15 data. Real email/phone collection remains disabled: only omitted,
        null or normalized-empty values are accepted. password_confirm is never
        part of this request.
      properties:
        login_id:
          type: string
          minLength: 2
          maxLength: 32
          pattern: "^[가-힣A-Za-z0-9_.-]+$"
        password:
          type: string
          minLength: 15
          maxLength: 128
        nickname:
          type: string
          minLength: 2
          maxLength: 20
          description: Trimmed NFC text; no newline, control, or bidi controls.
        email:
          type: [string, "null"]
          maxLength: 254
          description: >-
            One address; local part case is preserved and the domain is
            normalized. No DNS or SMTP verification is performed.
        phone:
          type: [string, "null"]
          maxLength: 32
          description: >-
            ASCII digits with an optional leading plus, spaces, and hyphens;
            the digit count must be 7-15.
    AdminUser:
      type: object
      additionalProperties: false
      required:
        [
          id,
          login_id,
          nickname,
          role,
          approved,
          account_version,
          app_count,
          created_at,
          first_approved_at,
          pending_expires_at,
        ]
      properties:
        id: { type: string, format: uuid }
        login_id: { type: string, minLength: 2, maxLength: 32 }
        nickname: { type: string, minLength: 2, maxLength: 20 }
        role: { $ref: "#/components/schemas/Role" }
        approved: { type: boolean }
        account_version:
          type: integer
          minimum: 1
          maximum: 9007199254740991
          description: >-
            Monotonic approval/credential version. Expected by approval writes;
            never exposed by public member DTOs.
        app_count:
          type: integer
          minimum: 0
          description: Current public and private apps owned by this member.
        created_at: { type: string, format: date-time }
        first_approved_at: { type: [string, "null"], format: date-time }
        pending_expires_at: { type: [string, "null"], format: date-time }
    AdminStats:
      type: object
      additionalProperties: false
      required:
        [
          total_users,
          pending_users,
          total_apps,
          healthy_apps,
          next_health_expiry_at,
          active_health_batch_id,
          latest_health_batch_id,
        ]
      properties:
        total_users: { type: integer, minimum: 0 }
        pending_users: { type: integer, minimum: 0 }
        total_apps: { type: integer, minimum: 0 }
        healthy_apps: { type: integer, minimum: 0 }
        next_health_expiry_at: { type: [string, "null"], format: date-time }
        active_health_batch_id: { type: [string, "null"], format: uuid }
        latest_health_batch_id: { type: [string, "null"], format: uuid }
    AdminApp:
      type: object
      additionalProperties: false
      required:
        [
          id,
          owner,
          name,
          url,
          is_public,
          theme_id,
          version,
          url_version,
          created_at,
          health,
        ]
      properties:
        id: { type: string, format: uuid }
        owner: { $ref: "#/components/schemas/Owner" }
        name: { type: string, minLength: 1, maxLength: 100 }
        url: { type: string, format: uri, maxLength: 2048 }
        is_public: { type: boolean }
        theme_id: { type: string, minLength: 1 }
        version: { type: integer, minimum: 1, maximum: 9007199254740991 }
        url_version: { type: integer, minimum: 1, maximum: 9007199254740991 }
        created_at: { type: string, format: date-time }
        health: { $ref: "#/components/schemas/HealthResult" }
    AdminAppPage:
      type: object
      additionalProperties: false
      required: [items, pagination, server_time]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminApp" }
        pagination: { $ref: "#/components/schemas/Pagination" }
        server_time: { type: string, format: date-time }
    AdminUserPage:
      type: object
      additionalProperties: false
      required: [items, pagination, stats, server_time]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminUser" }
        pagination: { $ref: "#/components/schemas/Pagination" }
        stats: { $ref: "#/components/schemas/AdminStats" }
        server_time: { type: string, format: date-time }
    CreateApprovalOperation:
      type: object
      additionalProperties: false
      required: [kind, target_id, expected_account_version, approved]
      properties:
        kind: { type: string, const: user_approval }
        target_id: { type: string, format: uuid }
        expected_account_version:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        approved: { type: boolean }
    CreatePasswordResetOperation:
      type: object
      additionalProperties: false
      required: [kind, target_id, expected_account_version, new_password]
      description: >-
        The new_password is included only in this key-issuance request and is
        never echoed or stored in the operation result. The implementation
        enforces a 16 KiB UTF-8 request limit and the shared 15–128 code point
        password policy. The versioned local common-password blocklist applies
        to the real API; Phase 1 mock does not apply that check.
      properties:
        kind: { type: string, const: user_password_reset }
        target_id: { type: string, format: uuid }
        expected_account_version:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        new_password: { type: string, minLength: 15, maxLength: 128 }
    CreateUserDeleteOperation:
      type: object
      additionalProperties: false
      required: [kind, target_id, expected_app_count]
      properties:
        kind: { type: string, const: user_delete }
        target_id: { type: string, format: uuid }
        expected_app_count:
          type: integer
          minimum: 0
          maximum: 9007199254740991
    CreateAppWriteOperation:
      type: object
      additionalProperties: false
      required: [kind, input]
      properties:
        kind: { type: string, const: app_create }
        input: { $ref: "#/components/schemas/AppInput" }
    CreateAppUpdateOperation:
      type: object
      additionalProperties: false
      required: [kind, target_id, expected_version, input]
      properties:
        kind: { type: string, const: app_update }
        target_id: { type: string, format: uuid }
        expected_version:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        input: { $ref: "#/components/schemas/AppPatch" }
    CreateAppDeleteOperation:
      type: object
      additionalProperties: false
      required: [kind, target_id, expected_version]
      properties:
        kind: { type: string, const: app_delete }
        target_id: { type: string, format: uuid }
        expected_version:
          type: integer
          minimum: 1
          maximum: 9007199254740991
    CreateWriteOperation:
      oneOf:
        - $ref: "#/components/schemas/CreateApprovalOperation"
        - $ref: "#/components/schemas/CreatePasswordResetOperation"
        - $ref: "#/components/schemas/CreateUserDeleteOperation"
        - $ref: "#/components/schemas/CreateAppWriteOperation"
        - $ref: "#/components/schemas/CreateAppUpdateOperation"
        - $ref: "#/components/schemas/CreateAppDeleteOperation"
    DeleteAppInput:
      type: object
      additionalProperties: false
      required: [expected_version]
      properties:
        expected_version:
          type: integer
          minimum: 1
          maximum: 9007199254740991
    AppPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        url: { type: string, minLength: 1, maxLength: 2048, format: uri }
        prompt: { type: string, minLength: 1, maxLength: 30000 }
        description: { type: string, minLength: 1, maxLength: 20000 }
        subject: { $ref: "#/components/schemas/Subject" }
        grades:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: "#/components/schemas/Grade" }
        is_public: { type: boolean }
        theme_id: { type: string }
        stack_db: { type: [string, "null"], maxLength: 200 }
        stack_backend: { type: [string, "null"], maxLength: 200 }
        stack_frontend: { type: [string, "null"], maxLength: 200 }
        stack_hosting: { type: [string, "null"], maxLength: 200 }
    UpdateAppInput:
      type: object
      additionalProperties: false
      required: [expected_version]
      minProperties: 2
      properties:
        expected_version:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        name: { type: string, minLength: 1, maxLength: 100 }
        url: { type: string, minLength: 1, maxLength: 2048, format: uri }
        prompt: { type: string, minLength: 1, maxLength: 30000 }
        description: { type: string, minLength: 1, maxLength: 20000 }
        subject: { $ref: "#/components/schemas/Subject" }
        grades:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: "#/components/schemas/Grade" }
        is_public: { type: boolean }
        theme_id: { type: string }
        stack_db: { type: [string, "null"], maxLength: 200 }
        stack_backend: { type: [string, "null"], maxLength: 200 }
        stack_frontend: { type: [string, "null"], maxLength: 200 }
        stack_hosting: { type: [string, "null"], maxLength: 200 }
    SetApprovalInput:
      type: object
      additionalProperties: false
      required: [approved, expected_account_version]
      properties:
        approved: { type: boolean }
        expected_account_version:
          type: integer
          minimum: 1
          maximum: 9007199254740991
    SetPasswordResetInput:
      type: object
      additionalProperties: false
      required: [new_password, expected_account_version]
      description: >-
        The new_password is matched against the same key-issuance input and is
        never echoed or stored in the operation result. The implementation
        enforces a 16 KiB UTF-8 request limit and the shared 15–128 code point
        password policy. The versioned local common-password blocklist applies
        to the real API; Phase 1 mock does not apply that check.
      properties:
        new_password: { type: string, minLength: 15, maxLength: 128 }
        expected_account_version:
          type: integer
          minimum: 1
          maximum: 9007199254740991
    DeleteAdminUserInput:
      type: object
      additionalProperties: false
      required: [expected_app_count]
      properties:
        expected_app_count:
          type: integer
          minimum: 0
          maximum: 9007199254740991
    ApprovalOperation:
      type: object
      additionalProperties: false
      required:
        [
          key,
          kind,
          target_id,
          issued_at,
          expires_at,
          state,
          applied_account_version,
          applied_approved,
          finalized_at,
          rejection_code,
          server_time,
        ]
      properties:
        key: { type: string, format: uuid }
        kind: { type: string, const: user_approval }
        target_id: { type: string, format: uuid }
        issued_at: { type: string, format: date-time }
