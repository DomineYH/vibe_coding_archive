[project]
name = "eduvibe-archive-backend"
version = "0.1.0"
requires-python = "==3.12.3"
dependencies = [
    "alembic==1.20.0",
    "dnspython==2.8.0",
    "httpx==0.28.1",
    "httpcore==1.0.9",
    "h11==0.16.0",
    "anyio==4.15.1",
    "fastapi==0.141.1",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "pwdlib[argon2]==0.3.1",
    "python-dotenv==1.2.3",
    "sqlalchemy==2.0.54",
    "uvicorn[standard]==0.53.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pyyaml==6.0.3",
    "ruff==0.16.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
