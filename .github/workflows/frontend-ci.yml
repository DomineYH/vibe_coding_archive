name: Frontend and backend/API CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    env:
      BACKEND_TEST_SHARDS: |
        tests/contracts
        tests/test_[a-d]*.py
        tests/test_[e-z]*.py
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.28"
          python-version: "3.12.3"
      - name: Install locked backend dependencies
        working-directory: backend
        run: uv sync --locked
      - name: Provision the fixed R15 password blocklist explicitly
        working-directory: backend
        run: |
          export APP_ENV=development DATABASE_PATH="$RUNNER_TEMP/provisioning.sqlite3" PUBLIC_ORIGIN=http://localhost:5174
          export PASSWORD_BLOCKLIST_PATH="$RUNNER_TEMP/password-blocklist-ncsc.txt"
          bash "$GITHUB_WORKSPACE/.github/scripts/retry.sh" uv run --frozen python -m app.cli prepare-password-blocklist
          echo "PASSWORD_BLOCKLIST_PATH=$PASSWORD_BLOCKLIST_PATH" >> "$GITHUB_ENV"
      - name: Install and record age from signed Ubuntu package indexes
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/retry.sh" sh -c 'sudo apt-get update && sudo apt-get install --yes age'
          dpkg-query -W -f='${Version}\n' age
          age --version
          age-keygen --version
          age --version | grep -Eq '^v?1\.[0-9]+\.[0-9]+$'
      - name: Backend test shard guard
        if: strategy.job-index == 0
        working-directory: backend
        run: APP_ENV=test bash "$GITHUB_WORKSPACE/.github/scripts/backend-shard-guard.sh" ${{ strategy.job-total }}
      - name: Backend tests
        working-directory: backend
        env:
          SHARD: ${{ matrix.shard }}
        # unquoted so the selection's glob expands
        run: APP_ENV=test uv run --frozen pytest $(printf '%s\n' "$BACKEND_TEST_SHARDS" | sed -n "$((SHARD + 1))p")
  backend-api:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.28"
          python-version: "3.12.3"
      - name: Install locked backend dependencies
        working-directory: backend
        run: uv sync --locked
      - name: Provision the fixed R15 password blocklist explicitly
        working-directory: backend
        run: |
          export APP_ENV=development DATABASE_PATH="$RUNNER_TEMP/provisioning.sqlite3" PUBLIC_ORIGIN=http://localhost:5174
          export PASSWORD_BLOCKLIST_PATH="$RUNNER_TEMP/password-blocklist-ncsc.txt"
          bash "$GITHUB_WORKSPACE/.github/scripts/retry.sh" uv run --frozen python -m app.cli prepare-password-blocklist
          echo "PASSWORD_BLOCKLIST_PATH=$PASSWORD_BLOCKLIST_PATH" >> "$GITHUB_ENV"
      - name: Backend lint
        working-directory: backend
        run: uv run --frozen ruff check .
      - name: Backend format check
        working-directory: backend
        run: uv run --frozen ruff format --check .
      - name: Install and record age from signed Ubuntu package indexes
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/retry.sh" sh -c 'sudo apt-get update && sudo apt-get install --yes age'
          dpkg-query -W -f='${Version}\n' age
          age --version
          age-keygen --version
          age --version | grep -Eq '^v?1\.[0-9]+\.[0-9]+$'
      - name: Real age backup encryption and decryption tests
        working-directory: backend
        env:
          CI: "true"
        run: APP_ENV=test uv run --frozen pytest -m requires_age tests/test_backup_process.py tests/test_restore_process.py -ra
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
      - name: Pin npm
        run: npm install --global npm@12.0.2
      - name: Install locked frontend dependencies for API E2E
        working-directory: frontend
        run: npm ci
      - name: Vite to Uvicorn forwarded-header security regression
        working-directory: backend
        run: APP_ENV=test uv run --frozen pytest tests/integration/dev_proxy_chain.py -q
      - name: Install Playwright Chromium for API E2E
        working-directory: frontend
        run: bash "$GITHUB_WORKSPACE/.github/scripts/retry.sh" npx playwright install --with-deps chromium
      - name: Install native Nginx serving tools
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/retry.sh" sh -c 'sudo apt-get update && sudo apt-get install --yes nginx openssl'
          nginx -v
          openssl version
          dpkg-query --show nginx openssl
      - name: Build and check the same-origin API release
        working-directory: frontend
        run: npm run build && npm run check:dist
      - name: Native HTTPS Nginx serving contracts
        working-directory: frontend
        run: npm run test:e2e:api -- --nginx e2e-api/static-serving.spec.js
      - name: Safe process logging and local retention contracts
        working-directory: backend
        env:
          HEALTH_CHECKS_ENABLED: "false"
        run: APP_ENV=test uv run --frozen pytest tests/test_safe_logging.py tests/test_purge_expired.py -ra
      - name: Service unit syntax and explicit migration lifecycle contracts
        working-directory: backend
        env:
          CI: "true"
          HEALTH_CHECKS_ENABLED: "false"
        run: |
          systemd-analyze --version
          APP_ENV=test uv run --frozen pytest tests/test_service_units.py tests/test_migration_lifecycle.py tests/test_health_worker_process.py -ra
      - name: Native HTTPS functional release contracts
        working-directory: frontend
        env:
          CI: "true"
          HEALTH_CHECKS_ENABLED: "false"
        run: npm run test:e2e:api -- --nginx-functional
  api-e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.28"
          python-version: "3.12.3"
      - name: Install locked backend dependencies
        working-directory: backend
        run: uv sync --locked
      - name: Provision the fixed R15 password blocklist explicitly
        working-directory: backend
        run: |
          export APP_ENV=development DATABASE_PATH="$RUNNER_TEMP/provisioning.sqlite3" PUBLIC_ORIGIN=http://localhost:5174
          export PASSWORD_BLOCKLIST_PATH="$RUNNER_TEMP/password-blocklist-ncsc.txt"
          bash "$GITHUB_WORKSPACE/.github/scripts/retry.sh" uv run --frozen python -m app.cli prepare-password-blocklist
          echo "PASSWORD_BLOCKLIST_PATH=$PASSWORD_BLOCKLIST_PATH" >> "$GITHUB_ENV"
      - name: Install and record age from signed Ubuntu package indexes
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/retry.sh" sh -c 'sudo apt-get update && sudo apt-get install --yes age'
          dpkg-query -W -f='${Version}\n' age
          age --version
          age-keygen --version
          age --version | grep -Eq '^v?1\.[0-9]+\.[0-9]+$'
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
      - name: Pin npm
        run: npm install --global npm@12.0.2
      - name: Install locked frontend dependencies for API E2E
        working-directory: frontend
        run: npm ci
      - name: Install Playwright Chromium for API E2E
        working-directory: frontend
        run: bash "$GITHUB_WORKSPACE/.github/scripts/retry.sh" npx playwright install --with-deps chromium
      - name: API end-to-end tests
        working-directory: frontend
        run: npm run test:e2e:api
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Pin npm
        run: npm install --global npm@12.0.2
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: frontend
        run: bash "$GITHUB_WORKSPACE/.github/scripts/retry.sh" npx playwright install --with-deps chromium
      - name: Install source-reference CJK font
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/retry.sh" sudo apt-get install --yes fonts-noto-cjk
          sudo apt-get remove --yes fonts-wqy-zenhei
          fontconfig="$GITHUB_WORKSPACE/frontend/visual/fontconfig.conf"
          FONTCONFIG_FILE="$fontconfig" fc-cache --force
          for pattern in 'monospace:lang=ko' 'Noto Sans CJK KR:lang=ko'; do
            family="$(FONTCONFIG_FILE="$fontconfig" fc-match --format='%{family}' "$pattern")"
            if [ "$family" != "Noto Sans CJK JP" ]; then
              echo "::error::Expected Noto Sans CJK JP for $pattern; received $family"
              exit 1
            fi
          done
      - name: Install pinned visual Chromium
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/retry.sh" curl --fail --location --silent --show-error https://storage.googleapis.com/chrome-for-testing-public/151.0.7922.34/linux64/chrome-headless-shell-linux64.zip --output "$RUNNER_TEMP/chrome-151.zip"
          mkdir -p "$RUNNER_TEMP/chrome-151"
          unzip -q "$RUNNER_TEMP/chrome-151.zip" -d "$RUNNER_TEMP/chrome-151"
          echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE=$RUNNER_TEMP/chrome-151/chrome-headless-shell-linux64/chrome-headless-shell" >> "$GITHUB_ENV"
      - name: Static checks
        working-directory: frontend
        run: npm run check
      - name: Unit tests
        working-directory: frontend
        run: npm test
      - name: Browser tests
        working-directory: frontend
        run: npm run test:e2e
      - name: Mock build
        working-directory: frontend
        run: npm run build:mock
      - name: API build and bundle check
        working-directory: frontend
        run: npm run build && npm run check:dist
      - name: Source preservation check
        working-directory: frontend
        run: npm run check:reference
      - name: Visual comparisons
        working-directory: frontend
        env:
          FONTCONFIG_FILE: ${{ github.workspace }}/frontend/visual/fontconfig.conf
        run: npm run test:visual
      - name: Upload visual failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-test-results
          path: frontend/test-results/visual
          retention-days: 7
          if-no-files-found: ignore
