name: frontend

on:
  pull_request:
  push:

jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Pin npm
        run: npm install --global npm@12.0.2
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Install source-reference CJK font
        run: |
          sudo apt-get install --yes fonts-noto-cjk
          sudo apt-get remove --yes fonts-wqy-zenhei
          fontconfig="$GITHUB_WORKSPACE/frontend/visual/fontconfig.conf"
          FONTCONFIG_FILE="$fontconfig" fc-cache --force
          for pattern in 'monospace:lang=ko' 'Noto Sans CJK KR:lang=ko'; do
            family="$(FONTCONFIG_FILE="$fontconfig" fc-match --format='%{family}' "$pattern")"
            if [ "$family" != "Noto Sans CJK JP" ]; then
              echo "::error::Expected Noto Sans CJK JP for $pattern; received $family"
              exit 1
            fi
          done
      - name: Install pinned visual Chromium
        run: |
          curl --fail --location --silent --show-error https://storage.googleapis.com/chrome-for-testing-public/151.0.7922.34/linux64/chrome-headless-shell-linux64.zip --output "$RUNNER_TEMP/chrome-151.zip"
          mkdir -p "$RUNNER_TEMP/chrome-151"
          unzip -q "$RUNNER_TEMP/chrome-151.zip" -d "$RUNNER_TEMP/chrome-151"
          echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE=$RUNNER_TEMP/chrome-151/chrome-headless-shell-linux64/chrome-headless-shell" >> "$GITHUB_ENV"
      - name: Static checks
        working-directory: frontend
        run: npm run check
      - name: Unit tests
        working-directory: frontend
        run: npm test
      - name: Browser tests
        working-directory: frontend
        run: npm run test:e2e
      - name: Mock build
        working-directory: frontend
        run: npm run build:mock
      - name: API build and bundle check
        working-directory: frontend
        run: npm run build && npm run check:dist
      - name: Source preservation check
        working-directory: frontend
        run: npm run check:reference
      - name: Visual comparisons
        working-directory: frontend
        env:
          FONTCONFIG_FILE: ${{ github.workspace }}/frontend/visual/fontconfig.conf
        run: npm run test:visual
